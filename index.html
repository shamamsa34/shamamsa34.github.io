<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <meta charset="utf-8">
    <title>شمامسة تالتة ورابعة</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&family=Noto+Sans+Coptic&display=swap">
    <style>
        /* Layout: blue church-header band with a red stole ribbon underneath, then one centered app column (max 980px) whose views swap in place. One bright look in the logo's blue and red, deliberately single-theme for kids. */
        :root {
            color-scheme: light;
            --blue: #1f4aa8;
            --blue-d: #13336f;
            --blue-l: #e8eefa;
            --red: #e1262d;
            --red-d: #b51c22;
            --red-l: #fde8e8;
            --paper: #ffffff;
            --bg: #f4f7fd;
            --ink: #16244a;
            --muted: #5b6890;
            --line: #d8e1f3;
            --ok: #17914e;
            --ok-l: #e2f5ea;
            --star: #f2ac00;
            --f-display: "Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;
            --f-body: "Tajawal","Segoe UI",Tahoma,sans-serif;
            --f-coptic: "Noto Sans Coptic","Segoe UI Historic","Antinoou",serif;
            --r: 20px;
        }

        * {
            box-sizing: border-box
        }

        [hidden] {
            display: none!important
        }

        html {
            background: var(--bg)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--f-body);
            font-size: 17px;
            line-height: 1.65;
            direction: rtl
        }

        h1,h2,h3 {
            font-family: var(--f-display);
            margin: 0;
            line-height: 1.25;
            text-wrap: balance
        }

        button,input,select,textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        :focus-visible {
            outline: 3px solid var(--star);
            outline-offset: 2px
        }

        .cop {
            font-family: var(--f-coptic)
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding-left: max(16px,env(safe-area-inset-left,0px));
            padding-right: max(16px,env(safe-area-inset-right,0px))
        }

        /* header */
        header.top {
            background: var(--blue);
            color: var(--paper);
            position: relative
        }

        header.top .wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-block:14px 26px}

        header.top img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: var(--paper);
            border-radius: 50%;
            padding: 4px;
            flex: none
        }

        header.top h1 {
            font-size: 1.45rem;
            color: var(--paper)
        }

        header.top small {
            display: block;
            opacity: .85;
            font-size: .85rem
        }

        .who {
            margin-inline-start:auto;display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,.14);
            border-radius: 999px;
            padding: 4px 6px 4px 14px;
            font-weight: 700
        }

        .who button {
            border: 0;
            background: var(--paper);
            color: var(--blue);
            border-radius: 999px;
            padding: 3px 12px;
            font-size: .85rem;
            font-weight: 700
        }

        .stole {
            height: 16px;
            background: var(--red);
            position: relative
        }

        .stole::after {
            content: "";
            position: absolute;
            inset: auto 0 -10px;
            height: 10px;
            background: repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px)
        }

        main {
            padding-block:28px 48px}

        .view {
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        /* generic */
        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 20px
        }

        .btn {
            border: 0;
            border-radius: 14px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform .12s,background .15s;
            text-decoration: none
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn-blue {
            background: var(--blue);
            color: var(--paper)
        }

        .btn-blue:hover {
            background: var(--blue-d)
        }

        .btn-red {
            background: var(--red);
            color: var(--paper)
        }

        .btn-red:hover {
            background: var(--red-d)
        }

        .btn-soft {
            background: var(--blue-l);
            color: var(--blue)
        }

        .btn-line {
            background: var(--paper);
            color: var(--blue);
            border: 2px solid var(--line)
        }

        .btn-big {
            font-size: 1.2rem;
            padding: 16px 28px;
            border-radius: 18px
        }

        .btn[disabled] {
            opacity: .5;
            cursor: not-allowed
        }

        .back {
            align-self: flex-start;
            border: 0;
            background: none;
            color: var(--blue);
            font-weight: 700;
            padding: 4px 0;
            font-size: 1rem
        }

        .muted {
            color: var(--muted)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .title-xl {
            font-size: 2rem;
            color: var(--blue)
        }

        .lead {
            font-size: 1.1rem;
            color: var(--muted);
            margin: 4px 0 0
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 28px
        }

        .toast {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom,0px));
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--paper);
            padding: 10px 20px;
            border-radius: 12px;
            z-index: 50;
            font-weight: 500;
            max-width: calc(100% - 32px)
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
            padding: 40px
        }

        .spin {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 4px solid var(--blue-l);
            border-top-color: var(--blue);
            animation: spin 1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* name picker */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px
        }

        .hero img {
            width: 150px;
            height: auto
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center
        }

        .chip {
            border: 2px solid var(--line);
            background: var(--paper);
            border-radius: 999px;
            padding: 6px 18px;
            font-weight: 700;
            color: var(--muted)
        }

        .chip[aria-pressed="true"] {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--paper)
        }

        .search {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: block;
            border: 2px solid var(--line);
            border-radius: 16px;
            padding: 12px 16px;
            background: var(--paper);
            font-size: 1.05rem
        }

        .search:focus {
            border-color: var(--blue);
            outline: none
        }

        .names {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
            gap: 10px
        }

        .name {
            border: 2px solid var(--line);
            background: var(--paper);
            border-radius: 16px;
            padding: 14px 12px;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: right
        }

        .name:hover {
            border-color: var(--blue)
        }

        .av {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--blue-l);
            color: var(--blue);
            font-family: var(--f-display);
            flex: none
        }

        .name small {
            display: block;
            color: var(--muted);
            font-weight: 500;
            font-size: .8rem
        }

        /* home sections */
        .sections {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 16px
        }

        .sec {
            border: 0;
            border-radius: 24px;
            padding: 22px 20px;
            text-align: right;
            color: var(--paper);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 190px;
            position: relative;
            overflow: hidden;
            transition: transform .15s
        }

        .sec:hover {
            transform: translateY(-3px)
        }

        .sec .glyph {
            font-size: 2.6rem;
            line-height: 1;
            margin-bottom: auto
        }

        .sec h2 {
            font-size: 1.7rem;
            color: var(--paper)
        }

        .sec p {
            margin: 0;
            opacity: .9;
            font-size: .95rem
        }

        .sec-red {
            background: var(--red)
        }

        .sec-blue {
            background: var(--blue)
        }

        .sec-gold {
            background: var(--paper);
            color: var(--ink);
            border: 2px solid var(--line)
        }

        .sec-gold h2 {
            color: var(--blue)
        }

        .sec-gold .glyph {
            color: var(--star)
        }

        .sec .ring {
            position: absolute;
            left: -30px;
            bottom: -30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 14px solid rgba(255,255,255,.12)
        }

        /* lesson list */
        .lessons {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 14px
        }

        .lesson {
            border: 2px solid var(--line);
            background: var(--paper);
            border-radius: var(--r);
            padding: 16px;
            display: flex;
            gap: 14px;
            align-items: center;
            text-align: right
        }

        .lesson:hover {
            border-color: var(--blue)
        }

        .lesson .num {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--blue-l);
            color: var(--blue);
            display: grid;
            place-items: center;
            font-family: var(--f-display);
            font-size: 1.4rem;
            flex: none
        }

        .lesson .t {
            font-weight: 700;
            font-size: 1.08rem
        }

        .lesson .s {
            font-size: .85rem;
            color: var(--muted)
        }

        .lesson .done {
            margin-inline-start:auto;flex: none;
            font-size: .82rem;
            font-weight: 700;
            background: var(--ok-l);
            color: var(--ok);
            border-radius: 999px;
            padding: 3px 10px;
            white-space: nowrap
        }

        .lesson .new {
            margin-inline-start:auto;flex: none;
            font-size: .82rem;
            font-weight: 700;
            background: var(--red-l);
            color: var(--red);
            border-radius: 999px;
            padding: 3px 10px
        }

        /* video + quiz */
        .video {
            position: relative;
            aspect-ratio: 16/9;
            max-width: 100%;
            border-radius: var(--r);
            overflow: hidden;
            background: var(--blue-d)
        }

        .video iframe,.video video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0
        }

        .video.drive {
            aspect-ratio: 4/3
        }

        .video video {
            background: #000;
            object-fit: contain
        }

        .vfb {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 16px;
            color: #fff;
            background: #0b1a3a center/cover no-repeat;
            text-decoration: none
        }

        .vfb::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(10,20,50,.55)
        }

        .vfb>* {
            position: relative
        }

        .vfb .play {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: var(--red);
            display: grid;
            place-items: center
        }

        .vfb b {
            font-size: 1.1rem
        }

        .video:fullscreen {
            border-radius: 0;
            aspect-ratio: auto;
            width: 100%;
            height: 100%
        }

        .video:-webkit-full-screen {
            border-radius: 0;
            width: 100%;
            height: 100%
        }

        .vwrap {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .vtools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-start
        }

        .vtools a,.vtools button {
            border: 0;
            border-radius: 10px;
            padding: 7px 14px;
            font-weight: 700;
            font-size: .9rem;
            background: var(--blue-l);
            color: var(--blue);
            text-decoration: none
        }

        .vph {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--paper);
            text-align: center;
            padding: 16px
        }

        .vph .play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--red);
            display: grid;
            place-items: center
        }

        .vph a {
            color: var(--paper)
        }

        .quiz {
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .dots {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .dots i {
            width: 28px;
            height: 8px;
            border-radius: 99px;
            background: var(--line)
        }

        .dots i.ok {
            background: var(--ok)
        }

        .dots i.bad {
            background: var(--red)
        }

        .dots i.cur {
            background: var(--blue)
        }

        .q {
            font-family: var(--f-display);
            font-size: 1.55rem;
            color: var(--ink);
            line-height: 1.4
        }

        .opts {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px
        }

        .opt {
            border: 3px solid var(--line);
            background: var(--paper);
            border-radius: 18px;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: right;
            display: flex;
            gap: 12px;
            align-items: center;
            min-height: 70px
        }

        .opt:hover:not([disabled]) {
            border-color: var(--blue)
        }

        .opt .k {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--blue-l);
            color: var(--blue);
            display: grid;
            place-items: center;
            flex: none;
            font-family: var(--f-display)
        }

        .opt.ok {
            border-color: var(--ok);
            background: var(--ok-l)
        }

        .opt.ok .k {
            background: var(--ok);
            color: var(--paper)
        }

        .opt.bad {
            border-color: var(--red);
            background: var(--red-l)
        }

        .opt.bad .k {
            background: var(--red);
            color: var(--paper)
        }

        .opt[disabled] {
            cursor: default
        }

        .fb {
            border-radius: 16px;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap
        }

        .fb.ok {
            background: var(--ok-l);
            color: var(--ok)
        }

        .fb.bad {
            background: var(--red-l);
            color: var(--red-d)
        }

        .result {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 30px 20px
        }

        .stars {
            font-size: 3rem;
            letter-spacing: 6px;
            color: var(--line)
        }

        .stars b {
            color: var(--star);
            font-weight: 400
        }

        .score {
            font-family: var(--f-display);
            font-size: 3.2rem;
            color: var(--blue);
            line-height: 1
        }

        /* admin */
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--line)
        }

        .tab {
            border: 0;
            background: none;
            padding: 10px 16px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px
        }

        .tab[aria-selected="true"] {
            color: var(--red);
            border-bottom-color: var(--red)
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0
        }

        .field label {
            font-weight: 700;
            font-size: .92rem
        }

        .inp {
            border: 2px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            background: var(--paper);
            width: 100%;
            font-size: 1rem
        }

        .inp:focus {
            border-color: var(--blue);
            outline: none
        }

        textarea.inp {
            min-height: 80px;
            resize: vertical
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .qcard {
            border: 2px dashed var(--line);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .qhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .qhead b {
            color: var(--blue);
            font-family: var(--f-display);
            font-size: 1.15rem
        }

        .optrow {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .optrow input[type=radio] {
            width: 22px;
            height: 22px;
            accent-color: var(--ok);
            flex: none
        }

        .optrow .inp {
            flex: 1
        }

        .hint {
            font-size: .82rem;
            color: var(--muted)
        }

        .alist {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .aitem {
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            background: var(--paper);
            flex-wrap: wrap
        }

        .aitem .grow {
            flex: 1;
            min-width: 150px
        }

        .tag {
            font-size: .78rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--blue-l);
            color: var(--blue)
        }

        .tag.red {
            background: var(--red-l);
            color: var(--red)
        }

        .tag.off {
            background: var(--line);
            color: var(--muted)
        }

        .mini {
            border: 0;
            border-radius: 10px;
            padding: 6px 12px;
            font-weight: 700;
            font-size: .88rem;
            background: var(--blue-l);
            color: var(--blue)
        }

        .mini.del {
            background: var(--red-l);
            color: var(--red)
        }

        .mini.sure {
            background: var(--red);
            color: var(--paper)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 12px
        }

        .stat {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px
        }

        .stat b {
            display: block;
            font-family: var(--f-display);
            font-size: 1.8rem;
            color: var(--blue);
            line-height: 1.2
        }

        .stat span {
            font-size: .85rem;
            color: var(--muted)
        }

        .res {
            width: 100%;
            border-collapse: collapse;
            font-size: .92rem;
            font-variant-numeric: tabular-nums
        }

        .res th,.res td {
            padding: 8px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap
        }

        .res th {
            color: var(--muted);
            font-weight: 500
        }

        .demo-note {
            background: var(--red-l);
            color: var(--red-d);
            border-radius: 14px;
            padding: 10px 14px;
            font-size: .9rem
        }

        footer {
            text-align: center;
            padding-block:10px 30px;color: var(--muted);
            font-size: .85rem
        }

        footer button {
            border: 0;
            background: none;
            color: var(--muted);
            text-decoration: underline;
            font-size: .85rem
        }

        /* alhan, recorder, points */
        .sec-navy {
            background: var(--blue-d)
        }

        .tag.navy {
            background: var(--blue-d);
            color: var(--paper)
        }

        .media-audio {
            background: var(--blue-l);
            border-radius: var(--r);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: var(--blue)
        }

        .media-audio audio {
            width: 100%
        }

        .mload {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--paper)
        }

        .mload .spin {
            border-color: rgba(255,255,255,.25);
            border-top-color: var(--paper)
        }

        .rec {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            padding: 16px 8px
        }

        .micbtn {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 0;
            background: var(--red);
            display: grid;
            place-items: center;
            transition: transform .12s
        }

                    rej(e.message)

        async function remote(fn, args) {
            let r;
            try {
                r = await fetch(API_URL, {

                    headers: {

                throw 'مفيش اتصال بالإنترنت، جرّب تاني';
            }
            let j;
            try {
                j = await r.json();
            } catch (e) {
                throw 'السيرفر مش بيرد دلوقتي، جرّب كمان شوية';
            }
            if (!j.ok)
                throw j.error;
            return j.data;

        function lessonPoints(rules, score, total, section) {
            if (section === RECITE)

            return rules.solve + rules.correct * score + (total && score === total ? rules.full : 0);

        function leaderboardFrom(kids, results, rules, bonus) {
            const t = {};
            kids.filter(k => k.active !== false).forEach(k => t[String(k.id)] = {
                kidId: String(k.id),
                name: String(k.name),
                class: String(k.class),
                photo: String(k.photo || ''),
                points: 0,
                lessons: 0,
                bonus: 0,
                bySection: {}
            });
            const best = {};
            results.forEach(r => {
                const key = r.kidId + '|' + r.lessonId
                  , s = Number(r.score) || 0;
                if (!best[key] || s > best[key].score)
                    best[key] = {
                        kidId: String(r.kidId),
                        section: String(r.section),
                        score: s,
                        total: Number(r.total) || 0
                    }
            }
            );
            Object.values(best).forEach(b => {
                const o = t[b.kidId];
                if (!o)
                    return;
                const p = lessonPoints(rules, b.score, b.total, b.section);
                o.points += p;
                o.lessons++;
                o.bySection[b.section] = (o.bySection[b.section] || 0) + p;
            }
            );
            (bonus || []).forEach(x => {
                const o = t[String(x.kidId)];
                if (!o)
                    return;
                const p = Number(x.points) || 0;
                o.points += p;
                o.bonus += p;
                o.bySection[BONUS_KEY] = (o.bySection[BONUS_KEY] || 0) + p;
            }
            );
            return Object.values(t);

        function confetti(n) {
            try {
                if (matchMedia('(prefers-reduced-motion: reduce)').matches)
                    return;
            } catch (e) {}
            const c = document.createElement('canvas');
            c.className = 'confetti';
            document.body.appendChild(c);
            const ctx = c.getContext && c.getContext('2d');
            if (!ctx) {
                c.remove();
                return;
            }
            const W = c.width = innerWidth
              , H = c.height = innerHeight
              , cols = ['#1f4aa8', '#e1262d', '#f2ac00', '#17914e', '#ffd166'];
            const ps = Array.from({
                length: n || 90
            }, () => ({
                x: W / 2 + (Math.random() - .5) * W * .4,
                y: H * .3,
                vx: (Math.random() - .5) * 13,
                vy: -Math.random() * 13 - 5,
                s: 7 + Math.random() * 7,
                r: Math.random() * 6,
                vr: (Math.random() - .5) * .35,
                c: cols[Math.floor(Math.random() * cols.length)]
            }));
            let t = 0;
            (function frame() {
                ctx.clearRect(0, 0, W, H);
                ps.forEach(p => {
                    p.vy += .33;
                    p.vx *= .99;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.r += p.vr;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.r);
                    ctx.fillStyle = p.c;
                    ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
                    ctx.restore();
                }
                );
                if (++t < 150)
                    requestAnimationFrame(frame);
                else
                    c.remove();
            }
            )();
        }

        let AC = null;

        function sfx(kind) {
            if (isMuted())
                return;
            try {
                AC = AC || new (window.AudioContext || window.webkitAudioContext)();
                const notes = {
                    ok: [[660, 0], [990, .1]],
                    bad: [[260, 0], [196, .12]],
                    win: [[523, 0], [659, .11], [784, .22], [1047, .34]],
                    tap: [[620, 0]]
                }[kind] || [];
                notes.forEach( ([f,t]) => {
                    const o = AC.createOscillator()
                      , g = AC.createGain();
                    o.type = kind === 'bad' ? 'triangle' : 'sine';
                    o.frequency.value = f;
                    const s = AC.currentTime + t;
                    g.gain.setValueAtTime(.0001, s);
                    g.gain.exponentialRampToValueAtTime(.2, s + .02);
                    g.gain.exponentialRampToValueAtTime(.0001, s + .28);
                    o.connect(g);
                    g.connect(AC.destination);
                    o.start(s);
                    o.stop(s + .3);
                }
                );
            } catch (e) {}
        }

        /* ===================== RECORDER (kids' recitation + servant's voice) ===================== */
        let REC = null;
        function killRec() {
            if (REC) {
                try {
                    if (REC.mr && REC.mr.state !== 'inactive') {
                        REC.cancelled = true;
                        REC.mr.stop();
                    }
                } catch (e) {}
                try {
                    REC.stream && REC.stream.getTracks().forEach(t => t.stop());
                } catch (e) {}
                clearInterval(REC.timer);
                REC = null;
            }
        }
        function recSupported() {
            return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
        }
        /* opts: {startLabel, doneLabel, onSubmit(blob, secs, setStatus)} */
        function mountRecorder(el, opts) {
            const idle = () => {
                el.innerHTML = `<div class="rec"><button type="button" class="micbtn" data-r="go" aria-label="${esc(opts.startLabel)}">${ICON_MIC}</button><b>${esc(opts.startLabel)}</b></div>`;
                el.querySelector('[data-r="go"]').onclick = start;
            }
            ;
            const fail = (msg) => {
                el.innerHTML = `<div class="rec"><p class="fb bad" style="margin:0">${msg}</p><button type="button" class="btn btn-soft" data-r="retry">جرّب تاني</button></div>`;
                el.querySelector('[data-r="retry"]').onclick = idle;
            }
            ;
            async function start() {
                if (!recSupported())
                    return fail('الجهاز أو المتصفح ده مش بيدعم التسجيل. افتح الموقع من Chrome على الموبايل.');
                killRec();
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true
                        }
                    });
                } catch (e) {
                    return fail('محتاجين إذن المايكروفون. دوس على علامة القفل 🔒 جنب اللينك فوق، واسمح بالمايكروفون، وبعدين جرّب تاني.');
                }
                const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
                const type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
                let mr;
                try {
                    mr = new MediaRecorder(stream,type ? {
                        mimeType: type,
                        audioBitsPerSecond: 48000
                    } : {});
                } catch (e) {
                    mr = new MediaRecorder(stream);
                }
                const R = REC = {
                    mr,
                    stream,
                    chunks: [],
                    start: Date.now(),
                    timer: null
                };
                mr.ondataavailable = ev => {
                    if (ev.data && ev.data.size)
                        R.chunks.push(ev.data);
                }
                ;
                mr.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(R.timer);
                    if (R.cancelled || !el.isConnected)
                        return;
                    const blob = new Blob(R.chunks,{
                        type: (mr.mimeType || type || 'audio/webm')
                    });
                    const secs = (Date.now() - R.start) / 1000;
                    REC = null;
                    review(blob, secs);
                }
                ;
                mr.start(1000);
                el.innerHTML = `<div class="rec"><button type="button" class="micbtn on" data-r="stop" aria-label="وقّف التسجيل">${ICON_STOP}</button>
      <div class="timer" data-r="t">0:00</div><b>بيسجّل… دوس على المربع لما تخلص</b></div>`;
                el.querySelector('[data-r="stop"]').onclick = () => {
                    try {
                        mr.stop();
                    } catch (e) {}
                }
                ;
                R.timer = setInterval( () => {
                    const s = (Date.now() - R.start) / 1000;
                    const t = el.querySelector('[data-r="t"]');
                    if (t)
                        t.textContent = fmtSecs(s);
                    if (s >= MAX_REC_SECS) {
                        try {
                            mr.stop();
                        } catch (e) {}
                    }
                }
                , 500);
            }
            function review(blob, secs) {
                const url = URL.createObjectURL(blob);
                el.innerHTML = `<div class="rec"><p style="margin:0;font-weight:700">اسمع تسجيلك (${fmtSecs(secs)})</p><audio controls src="${url}" style="width:100%"></audio>
      <div class="row" style="justify-content:center"><button type="button" class="btn btn-red btn-big" data-r="ok">${esc(opts.doneLabel)}</button>
      <button type="button" class="btn btn-soft" data-r="again">🎙 سجّل تاني</button></div><p class="muted" data-r="st" style="margin:0"></p></div>`;
                el.querySelector('[data-r="again"]').onclick = start;
                const ok = el.querySelector('[data-r="ok"]');
                ok.onclick = async () => {
                    if (secs < 2) {
                        toast('التسجيل قصير أوي، سجّل تاني');
                        return;
                    }
                    ok.disabled = true;
                    el.querySelector('[data-r="again"]').disabled = true;

                    }

                    st('جاري رفع التسجيل… استنى ثواني');
                    try {

                    } catch (e) {
                        ok.disabled = false;
                        el.querySelector('[data-r="again"]').disabled = false;
                        st('ما اترفعش التسجيل (' + e + '). دوس تاني.');
                    }
                }
                ;

            idle();

                app.innerHTML = `<div class="card empty">ما قدرناش نحمّل البيانات. ${esc(e)}<br><button class="btn btn-blue" onclick="boot()">جرّب تاني</button></div>`;

            }
            const saved = store.get('kid');
            const k = saved && S.data.kids.find(x => String(x.id) === String(saved));
            if (k)
                selectKid(k.id, true);
            else
                showPicker();
        }

      <h2 class="title-xl">أهلاً يا شماس!</h2><p class="lead">دوّر على اسمك أو صورتك واضغط عليها عشان تبدأ</p></div>
    <div class="chips" role="group" aria-label="الفصل">${classes.map(c => `<button type="button" class="chip" aria-pressed="${c === S.classFilter}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <input class="search" id="kidSearch" type="search" placeholder="اكتب اسمك…" value="${esc(S.search)}" autocomplete="off">
    <div class="names" id="names"></div>
    <div style="text-align:center"><button type="button" class="btn btn-gold" id="pickBoard">🏆 شوف لوحة الأبطال</button></div></section>`;
            app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
                S.classFilter = b.dataset.c;
                showPicker();
            }
            );
            const s = $('#kidSearch');
            s.oninput = () => {
                S.search = s.value;
                drawNames();
            }
            ;
            $('#pickBoard').onclick = showBoard;
            drawNames();
        }
        function drawNames() {
            const q = S.search.trim();
            const list = S.data.kids.filter(k => (S.classFilter === 'الكل' || k.class === S.classFilter) && (!q || String(k.name).includes(q))).sort( (a, b) => String(a.name).localeCompare(String(b.name), 'ar'));
            $('#names').innerHTML = list.length ? list.map(k => `<button type="button" class="name" data-id="${esc(k.id)}">${avatar(k, 52)}<span>${esc(k.name)}<small>${esc(k.class)}</small></span></button>`).join('') : `<div class="empty" style="grid-column:1/-1">مش لاقي اسمك؟ قول للخادم يضيفه.</div>`;
            $('#names').querySelectorAll('.name').forEach(b => b.onclick = () => {
                sfx('tap');
                selectKid(b.dataset.id);
            }
            );
        }
        async function selectKid(id) {
            S.kid = S.data.kids.find(k => String(k.id) === String(id));
            store.set('kid', S.kid.id);
            $('#whoName').textContent = S.kid.name.split(' ')[0];
            $('#whoAva').innerHTML = avatar(S.kid, 30);
            $('#who').hidden = false;
            try {
                S.progress = await api('getKidProgress', S.kid.id);
            } catch (e) {
                S.progress = {};
            }
            showHome();
        }
        function changeKid() {
            store.set('kid', null);
            S.search = '';
            showPicker();
        }
        $('#changeKid').onclick = changeKid;

        /* ===================== HOME ===================== */
        function showHome() {
            killRec();
            S.inAdmin = false;
            setNav('home');
            const count = key => S.data.lessons.filter(l => l.section === key).length;
            const fresh = key => S.data.lessons.filter(l => l.section === key && !S.progress[l.id]).length;
            app.innerHTML = `<section class="view">
    <div class="hcard" id="hcard">${avatar(S.kid, 84, 'ring-1')}<div class="hc-main"><h2>أهلاً يا ${esc(S.kid.name.split(' ')[0])} 👋</h2><div class="hc-stats"><span class="skel">جاري حساب نقطك…</span></div></div></div>
    <p class="lead" style="margin:0">اختار اللي عايز تعمله النهارده</p>
    <div class="sections">
      ${SECTIONS.map(s => {
                const n = fresh(s.key);
                return `<button type="button" class="sec ${s.cls}" data-s="${esc(s.key)}"><span class="ring"></span>${n ? `<span class="newpill">${n} جديد</span>` : ''}<span class="glyph">${s.glyph}</span><h2>${s.title}</h2><p>${s.sub} · ${count(s.key)} ${s.recite ? 'لحن' : 'درس'}</p></button>`;
            }
            ).join('')}
      <button type="button" class="sec sec-gold" id="goBoard"><span class="ring"></span><span class="glyph">🏆</span><h2>الأبطال</h2><p>مين الأول في النقط؟</p></button>
    </div></section>`;
            app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
                sfx('tap');
                showSection(b.dataset.s);
            }
            );
            $('#goBoard').onclick = showBoard;
            goTop();
            getBoard().then(B => {
                const hc = $('#hcard');
                if (!hc || !S.kid)
                    return;
                const rows = rankRows(B, 'all', 'الكل')
                  , me = rows.find(r => r.kidId === String(S.kid.id));

      <div class="field"><label for="pSolve">نقط حل الدرس</label><input class="inp" id="pSolve" type="number" min="0" step="1" value="${R.solve}"><span class="hint">لأي طفل يخلّص الأسئلة</span></div>
      <div class="field"><label for="pCorrect">نقط كل إجابة صح</label><input class="inp" id="pCorrect" type="number" min="0" step="1" value="${R.correct}"><span class="hint">0 = مش بتزوّد</span></div>
      <div class="field"><label for="pFull">بونص الدرجة النهائية</label><input class="inp" id="pFull" type="number" min="0" step="1" value="${R.full}"><span class="hint">لو كل الأسئلة صح</span></div>
      <div class="field"><label for="pRecite">نقط تسميع اللحن</label><input class="inp" id="pRecite" type="number" min="0" step="1" value="${R.recite ?? 15}"><span class="hint">لما يدوس «خلصت التسميع»</span></div>
    </div>
    <p class="hint" style="margin:0" id="pEx"></p>
    <button class="btn btn-red" type="submit" style="align-self:flex-start">حفظ نظام النقط</button></form>
  <form class="card view" id="pf" style="gap:12px;max-width:420px">
    <h3 style="color:var(--blue)">تغيير كلمة سر الإدارة</h3>
    <div class="field"><label for="np1">كلمة السر الجديدة</label><input class="inp" id="np1" type="password" autocomplete="new-password" minlength="4"></div>
    <div class="field"><label for="np2">اكتبها تاني</label><input class="inp" id="np2" type="password" autocomplete="new-password"></div>
    <div id="perr" style="color:var(--red)"></div>
    <button class="btn btn-blue" type="submit" style="align-self:flex-start">حفظ</button></form></div>`;
            drawCats();
            $('#phSync').onclick = async () => {
                const b = $('#phSync');
                b.disabled = true;
                b.textContent = 'جاري الربط…';
                try {
                    const r = await adminCall('adminSyncPhotos', $('#phUrl').value.trim());
                    const p = r.photoReport || {
                        matched: 0,
                        unmatched: [],
                        missing: []
                    };
                    $('#phRep').innerHTML = `<div class="fb ok" style="display:block">✓ اتربطت ${p.matched} صورة</div>
        ${p.unmatched.length ? `<p class="hint">صور مش عارف هي لمين (غيّر اسم الملف لاسم الطفل): ${p.unmatched.map(esc).join('، ')}</p>` : ''}
        ${p.missing.length ? `<p class="hint">أطفال لسه من غير صورة: ${p.missing.map(esc).join('، ')}</p>` : ''}`;
                    S.board = null;
                } catch (e) {
                    $('#phRep').innerHTML = `<p class="fb bad">${esc(e)}</p>`;
                }
                b.disabled = false;
                b.textContent = 'اربط الصور';
            }
            ;
            $('#catAdd').onclick = () => {
                cats.push({
                    name: '',
                    points: 5,
                    att: false
                });
                drawCats();
                $('#catRows').querySelector('.optrow:last-child input').focus();
            }
            ;
            $('#catf').onsubmit = async e => {
                e.preventDefault();
                const clean = cats.map(c => ({
                    name: String(c.name || '').trim(),
                    points: Math.round(Number(c.points) || 0),
                    att: !!c.att
                })).filter(c => c.name && c.points);
                try {
                    await adminCall('adminSaveCategories', clean);
                    S.admin.bf = null;
                    S.admin.af = null;
                    toast('اتحفظت الأنواع');
                    showAdmin('settings');
                } catch (err) {
                    toast(err);
                }
            }
            ;
            const val = () => ({
                solve: Math.max(0, Math.round(+$('#pSolve').value || 0)),
                correct: Math.max(0, Math.round(+$('#pCorrect').value || 0)),
                full: Math.max(0, Math.round(+$('#pFull').value || 0)),
                recite: Math.max(0, Math.round(+$('#pRecite').value || 0))
            });
            const ex = () => {
                const r = val();
                $('#pEx').textContent = `مثال: درس فيه 5 أسئلة، الطفل جاوب 4 صح ← ياخد ${nq(lessonPoints(r, 4, 5))}. لو جاوب الـ5 صح ← ${nq(lessonPoints(r, 5, 5))}. تسميع لحن ← ${nq(r.recite)}.`;
            }
            ;
            ['pSolve', 'pCorrect', 'pFull', 'pRecite'].forEach(id => $('#' + id).oninput = ex);
            ex();
            $('#ptf').onsubmit = async e => {
                e.preventDefault();
                try {
                    await adminCall('adminSavePoints', val());
                    toast('اتحفظ نظام النقط');
                } catch (err) {
                    toast(err);
                }
            }
            ;
            $('#pf').onsubmit = async e => {
                e.preventDefault();
                const a = $('#np1').value
                  , b = $('#np2').value;
                if (a.length < 4)
                    return $('#perr').textContent = 'كلمة السر لازم تبقى 4 حروف أو أرقام على الأقل.';
                if (a !== b)
                    return $('#perr').textContent = 'الكلمتين مش زي بعض.';
                try {
                    await api('adminChangePassword', S.admin.pw, a);
                    S.admin.pw = a;
                    toast('اتغيرت كلمة السر');
                    $('#pf').reset();
                    $('#perr').textContent = '';
                } catch (err) {
                    $('#perr').textContent = err;
                }
            }
            ;
        }

        boot();
    </script>
</html>
