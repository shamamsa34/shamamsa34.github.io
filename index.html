      ${ks.length?`<div class="alist">${ks.map(k=>`<div class="aitem" data-row="${esc(k.id)}">${avatar(k,44)}<span class="grow">${esc(k.name)}</span>
        <label class="mini" style="cursor:pointer">📷<input type="file" accept="image/*" data-ph="${esc(k.id)}" hidden></label>
        <button type="button" class="mini" data-ek="${esc(k.id)}">تعديل</button><button type="button" class="mini del" data-rk="${esc(k.id)}">شيل</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">مفيش أسماء.</p>'}</div>`}).join('')}
  </div>`;
  $('#kform').onsubmit=async e=>{ e.preventDefault();
    const names=$('#kNames').value.split(/\n|،|,/).map(s=>s.trim()).filter(Boolean);
    if(!names.length){ toast('اكتب اسم واحد على الأقل'); return; }
    $('#kAdd').disabled=true;
    try{ const before=activeKids(S.admin.data).length; await adminCall('adminAddKids',names,$('#kCls').value);
      toast(`اتضاف ${activeKids(S.admin.data).length-before} اسم`); showAdmin('kids'); }catch(err){ toast(err); $('#kAdd').disabled=false; } };
  $('#pane').querySelectorAll('[data-ph]').forEach(inp=>inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return; const row=inp.closest('.aitem'); const lab=inp.closest('label');
    lab.firstChild.textContent='⏳';
    try{ const blob=await resizeImage(f,420); const data=await blobToB64(blob);
      await adminCall('adminSetKidPhoto',inp.dataset.ph,{data,mime:'image/jpeg'}); toast('اتحطت الصورة'); showAdmin('kids'); }
    catch(e){ toast(e); lab.firstChild.textContent='📷'; } });
  $('#pane').querySelectorAll('[data-ek]').forEach(b=>b.onclick=()=>{
    const k=active.find(x=>x.id===b.dataset.ek), row=b.closest('.aitem');
    row.innerHTML=`<input class="inp grow" id="en_${esc(k.id)}" value="${esc(k.name)}" aria-label="الاسم">
      <select class="inp" id="ec_${esc(k.id)}" style="width:auto">${CLASSES.map(c=>`<option ${c===k.class?'selected':''}>${c}</option>`).join('')}</select>
      <button type="button" class="mini" data-sv>حفظ</button><button type="button" class="mini del" data-cn>إلغاء</button>`;
    const inp=row.querySelector('input'); inp.focus(); inp.select();
    row.querySelector('[data-cn]').onclick=()=>showAdmin('kids');
    const save=async()=>{ const nm=inp.value.trim(); if(!nm){ toast('اكتب الاسم'); return; }
      row.querySelector('[data-sv]').disabled=true;
      try{ await adminCall('adminUpdateKid',k.id,nm,row.querySelector('select').value); toast('اتعدّل الاسم'); showAdmin('kids'); }
      catch(e){ toast(e); row.querySelector('[data-sv]').disabled=false; } };
    row.querySelector('[data-sv]').onclick=save;
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } };
  });
  $('#pane').querySelectorAll('[data-rk]').forEach(b=>twoStep(b,'متأكد؟',async()=>{
    try{ await adminCall('adminRemoveKid',b.dataset.rk); toast('اتشال الاسم (نتايجه القديمة محفوظة)'); showAdmin('kids'); }catch(e){ toast(e); } }));
}

/* --- results --- */
function paneResults(d){
  const f=S.admin.rf||(S.admin.rf={sec:'all',cls:'الكل',q:''});
  const draw=()=>{
    const rows=d.results.filter(r=>(f.sec==='all'||r.section===f.sec)&&(f.cls==='الكل'||r.class===f.cls)&&(!f.q||String(r.kidName).includes(f.q)||String(r.lessonTitle).includes(f.q)));
    const quiz=d.results.filter(r=>r.section!==RECITE);
    const kids=new Set(d.results.map(r=>r.kidId)).size;
    const avg=quiz.length?Math.round(quiz.reduce((a,r)=>a+(r.total?r.score/r.total:0),0)/quiz.length*100):0;
    $('#pane').innerHTML=`<div class="view">
      <div class="stats"><div class="stat"><b>${d.results.length}</b><span>مرة حل درس أو سمّع</span></div><div class="stat"><b>${kids}</b><span>طفل شارك</span></div><div class="stat"><b>${avg}%</b><span>متوسط الإجابات الصح</span></div></div>
      <div class="card view" style="gap:12px">
        <div class="row" style="justify-content:space-between"><h3 style="color:var(--blue)">كل النتايج</h3>
          <div class="row">${d.xlsxUrl?`<a class="btn btn-red" href="${esc(d.xlsxUrl)}" target="_blank" rel="noopener">⬇ تنزيل Excel</a><a class="btn btn-line" href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">فتح الشيت</a>`:'<span class="hint">زرار تنزيل Excel بيظهر في الموقع الحقيقي</span>'}</div></div>
        <div class="row"><select class="inp" id="rSec" style="width:auto"><option value="all">كل الأقسام</option>${SECTIONS.map(s=>`<option value="${esc(s.key)}" ${f.sec===s.key?'selected':''}>${s.title}</option>`).join('')}</select>
          <select class="inp" id="rCls" style="width:auto"><option>الكل</option>${CLASSES.map(c=>`<option ${f.cls===c?'selected':''}>${c}</option>`).join('')}</select>
          <input class="inp" id="rQ" placeholder="دوّر باسم طفل أو درس" value="${esc(f.q)}" style="flex:1;min-width:160px"></div>
        <div class="tbl"><table class="res"><thead><tr><th>الوقت</th><th>الاسم</th><th>الفصل</th><th>القسم</th><th>الدرس</th><th>الدرجة</th></tr></thead><tbody>
          ${rows.length?rows.map(r=>`<tr><td>${fmtTime(r.timestamp)}</td><td>${esc(r.kidName)}</td><td>${esc(r.class)}</td><td>${esc(secTitle(r.section))}</td><td>${esc(r.lessonTitle)}</td><td>${r.section===RECITE?'🎙 سمّع':`<b>${r.score}</b> / ${r.total}`}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">مفيش نتايج.</td></tr>'}
        </tbody></table></div>
        <p class="hint" style="margin:0">تفاصيل كل سؤال موجودة في صفحة «Answers»، ونقط الحصة في صفحة «Bonus» جوه الشيت.</p>
      </div></div>`;
    $('#rSec').onchange=e=>{f.sec=e.target.value;draw();};
    $('#rCls').onchange=e=>{f.cls=e.target.value;draw();};
    $('#rQ').oninput=e=>{f.q=e.target.value; clearTimeout(f.t); f.t=setTimeout(()=>{draw(); const i=$('#rQ'); i.focus(); i.setSelectionRange(i.value.length,i.value.length);},350);};
  };
  draw();
}

/* --- settings --- */
function paneSettings(d){
  const R=d.rules||{solve:5,correct:0,full:0,recite:15};
  const cats=(d.cats||[]).map(c=>({...c}));
  const drawCats=()=>{
    $('#catRows').innerHTML=cats.map((c,i)=>`<div class="optrow catrow"><input class="inp" data-cn="${i}" value="${esc(c.name)}" placeholder="مثلاً: حضور القداس"><input class="inp" data-cp="${i}" type="number" step="1" value="${esc(c.points)}" style="max-width:100px">
      <label class="attchk"><input type="checkbox" data-ca="${i}" ${c.att?'checked':''}> حضور</label><button type="button" class="mini del" data-cx="${i}">شيل</button></div>`).join('')||'<p class="muted" style="margin:0">مفيش أنواع.</p>';
    $('#catRows').querySelectorAll('[data-cn]').forEach(x=>x.oninput=()=>{ cats[x.dataset.cn].name=x.value; });
    $('#catRows').querySelectorAll('[data-cp]').forEach(x=>x.oninput=()=>{ cats[x.dataset.cp].points=x.value; });
    $('#catRows').querySelectorAll('[data-ca]').forEach(x=>x.onchange=()=>{ cats[x.dataset.ca].att=x.checked; });
    $('#catRows').querySelectorAll('[data-cx]').forEach(x=>x.onclick=()=>{ cats.splice(Number(x.dataset.cx),1); drawCats(); });
  };
  $('#pane').innerHTML=`<div class="view">
  <div class="card view" style="gap:12px">
    <h3 style="color:var(--blue)">📷 صور الأطفال</h3>
    <p class="hint" style="margin:0">حط كل الصور في فولدر واحد على Google Drive، وسمّي كل صورة باسم الطفل (مثلاً «كارلوس أيمن سعد.jpg»). الموقع بيطابق الاسم حتى لو فيه اختلاف بسيط في الكتابة.</p>
    <div class="row"><input class="inp" id="phUrl" dir="ltr" placeholder="https://drive.google.com/drive/folders/…" value="${d.photosFolder?esc('https://drive.google.com/drive/folders/'+d.photosFolder):''}" style="flex:1;min-width:220px">
      <button type="button" class="btn btn-red" id="phSync">اربط الصور</button></div>
    <p class="hint" style="margin:0">الصور هتبقى ظاهرة لأي حد معاه لينك الموقع. ولو ضفت صور جديدة للفولدر، دوس «اربط الصور» تاني.</p>
    <div id="phRep"></div></div>
  <form class="card view" id="catf" style="gap:12px">
    <h3 style="color:var(--blue)">أنواع النقط</h3>
    <p class="hint" style="margin:0">علامة «حضور» بتخلي النوع يظهر في تبويب «✅ الحضور». لو اسمه فيه «قداس» أو «حصة» بيتكتب كمان في صفحة الغياب في الشيت.</p>
    <div class="view" style="gap:8px" id="catRows"></div>
    <div class="row"><button type="button" class="btn btn-soft" id="catAdd">+ نوع جديد</button><button type="submit" class="btn btn-red">حفظ الأنواع</button></div></form>
  <form class="card view" id="ptf" style="gap:14px">
    <h3 style="color:var(--blue)">نقط الدروس والألحان</h3>
    <p class="hint" style="margin:0">كل درس أو لحن بيتحسب للطفل مرة واحدة بس. لو غيّرت الأرقام، لوحة الأبطال كلها بتتحسب من جديد.</p>
    <div class="stats stats4">
      <div class="field"><label for="pSolve">نقط حل الدرس</label><input class="inp" id="pSolve" type="number" min="0" step="1" value="${R.solve}"><span class="hint">لأي طفل يخلّص الأسئلة</span></div>
      <div class="field"><label for="pCorrect">نقط كل إجابة صح</label><input class="inp" id="pCorrect" type="number" min="0" step="1" value="${R.correct}"><span class="hint">0 = مش بتزوّد</span></div>
      <div class="field"><label for="pFull">بونص الدرجة النهائية</label><input class="inp" id="pFull" type="number" min="0" step="1" value="${R.full}"><span class="hint">لو كل الأسئلة صح</span></div>
      <div class="field"><label for="pRecite">نقط تسميع اللحن</label><input class="inp" id="pRecite" type="number" min="0" step="1" value="${R.recite??15}"><span class="hint">لما يدوس «خلصت التسميع»</span></div>
    </div>
    <p class="hint" style="margin:0" id="pEx"></p>
    <button class="btn btn-red" type="submit" style="align-self:flex-start">حفظ نظام النقط</button></form>
  <form class="card view" id="pf" style="gap:12px;max-width:420px">
    <h3 style="color:var(--blue)">تغيير كلمة سر الإدارة</h3>
    <div class="field"><label for="np1">كلمة السر الجديدة</label><input class="inp" id="np1" type="password" autocomplete="new-password" minlength="4"></div>
    <div class="field"><label for="np2">اكتبها تاني</label><input class="inp" id="np2" type="password" autocomplete="new-password"></div>
    <div id="perr" style="color:var(--red)"></div>
    <button class="btn btn-blue" type="submit" style="align-self:flex-start">حفظ</button></form></div>`;
  drawCats();
  $('#phSync').onclick=async()=>{ const b=$('#phSync'); b.disabled=true; b.textContent='جاري الربط…';
    try{ const r=await adminCall('adminSyncPhotos',$('#phUrl').value.trim()); const p=r.photoReport||{matched:0,unmatched:[],missing:[]};
      $('#phRep').innerHTML=`<div class="fb ok" style="display:block">✓ اتربطت ${p.matched} صورة</div>
        ${p.unmatched.length?`<p class="hint">صور مش عارف هي لمين (غيّر اسم الملف لاسم الطفل): ${p.unmatched.map(esc).join('، ')}</p>`:''}
        ${p.missing.length?`<p class="hint">أطفال لسه من غير صورة: ${p.missing.map(esc).join('، ')}</p>`:''}`;
      S.board=null; }
    catch(e){ $('#phRep').innerHTML=`<p class="fb bad">${esc(e)}</p>`; }
    b.disabled=false; b.textContent='اربط الصور'; };
  $('#catAdd').onclick=()=>{ cats.push({name:'',points:5,att:false}); drawCats(); $('#catRows').querySelector('.optrow:last-child input').focus(); };
  $('#catf').onsubmit=async e=>{ e.preventDefault();
    const clean=cats.map(c=>({name:String(c.name||'').trim(),points:Math.round(Number(c.points)||0),att:!!c.att})).filter(c=>c.name&&c.points);
    try{ await adminCall('adminSaveCategories',clean); S.admin.bf=null; S.admin.af=null; toast('اتحفظت الأنواع'); showAdmin('settings'); }catch(err){ toast(err); } };
  const val=()=>({solve:Math.max(0,Math.round(+$('#pSolve').value||0)),correct:Math.max(0,Math.round(+$('#pCorrect').value||0)),full:Math.max(0,Math.round(+$('#pFull').value||0)),recite:Math.max(0,Math.round(+$('#pRecite').value||0))});
  const ex=()=>{const r=val(); $('#pEx').textContent=`مثال: درس فيه 5 أسئلة، الطفل جاوب 4 صح ← ياخد ${nq(lessonPoints(r,4,5))}. لو جاوب الـ5 صح ← ${nq(lessonPoints(r,5,5))}. تسميع لحن ← ${nq(r.recite)}.`;};
  ['pSolve','pCorrect','pFull','pRecite'].forEach(id=>$('#'+id).oninput=ex); ex();
  $('#ptf').onsubmit=async e=>{ e.preventDefault();
    try{ await adminCall('adminSavePoints',val()); toast('اتحفظ نظام النقط'); }catch(err){ toast(err); } };
  $('#pf').onsubmit=async e=>{ e.preventDefault(); const a=$('#np1').value,b=$('#np2').value;
    if(a.length<4) return $('#perr').textContent='كلمة السر لازم تبقى 4 حروف أو أرقام على الأقل.';
    if(a!==b) return $('#perr').textContent='الكلمتين مش زي بعض.';
    try{ await api('adminChangePassword',S.admin.pw,a); S.admin.pw=a; toast('اتغيرت كلمة السر'); $('#pf').reset(); $('#perr').textContent=''; }catch(err){ $('#perr').textContent=err; } };
}

boot();

</script>

</html>
