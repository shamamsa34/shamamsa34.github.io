<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>شمامسة تالتة ورابعة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&family=Noto+Sans+Coptic&display=swap">
<style>
/* Layout: blue church-header band with a red stole ribbon underneath, then one centered app column (max 980px) whose views swap in place. One bright look in the logo's blue and red, deliberately single-theme for kids. */
:root{
  color-scheme:light;
  --blue:#1f4aa8; --blue-d:#13336f; --blue-l:#e8eefa; --red:#e1262d; --red-d:#b51c22; --red-l:#fde8e8;
  --paper:#ffffff; --bg:#f4f7fd; --ink:#16244a; --muted:#5b6890; --line:#d8e1f3;
  --ok:#17914e; --ok-l:#e2f5ea; --star:#f2ac00;
  --f-display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-coptic:"Noto Sans Coptic","Segoe UI Historic","Antinoou",serif;
  --r:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.cop{font-family:var(--f-coptic)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{background:var(--blue);color:var(--paper);position:relative}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px 26px}
header.top img{width:64px;height:64px;object-fit:contain;background:var(--paper);border-radius:50%;padding:4px;flex:none}
header.top h1{font-size:1.45rem;color:var(--paper)}
header.top small{display:block;opacity:.85;font-size:.85rem}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700}
.who button{border:0;background:var(--paper);color:var(--blue);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
.stole{height:16px;background:var(--red);position:relative}
.stole::after{content:"";position:absolute;inset:auto 0 -10px;height:10px;
  background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px)}
main{padding-block:28px 48px}
.view{display:flex;flex-direction:column;gap:20px}

/* generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:var(--paper)} .btn-blue:hover{background:var(--blue-d)}
.btn-red{background:var(--red);color:var(--paper)} .btn-red:hover{background:var(--red-d)}
.btn-soft{background:var(--blue-l);color:var(--blue)}
.btn-line{background:var(--paper);color:var(--blue);border:2px solid var(--line)}
.btn-big{font-size:1.2rem;padding:16px 28px;border-radius:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{align-self:flex-start;border:0;background:none;color:var(--blue);font-weight:700;padding:4px 0;font-size:1rem}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.title-xl{font-size:2rem;color:var(--blue)}
.lead{font-size:1.1rem;color:var(--muted);margin:4px 0 0}
.empty{text-align:center;color:var(--muted);padding:28px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:12px;z-index:50;font-weight:500;max-width:calc(100% - 32px)}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:40px}
.spin{width:26px;height:26px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* name picker */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.hero img{width:150px;height:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 18px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.search{width:100%;max-width:420px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--paper);font-size:1.05rem}
.search:focus{border-color:var(--blue);outline:none}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.name{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 12px;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:10px;text-align:right}
.name:hover{border-color:var(--blue)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue-l);color:var(--blue);font-family:var(--f-display);flex:none}
.name small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}

/* home sections */
.sections{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.sec{border:0;border-radius:24px;padding:22px 20px;text-align:right;color:var(--paper);display:flex;flex-direction:column;gap:6px;min-height:190px;position:relative;overflow:hidden;transition:transform .15s}
.sec:hover{transform:translateY(-3px)}
.sec .glyph{font-size:2.6rem;line-height:1;margin-bottom:auto}
.sec h2{font-size:1.7rem;color:var(--paper)}
.sec p{margin:0;opacity:.9;font-size:.95rem}
.sec-red{background:var(--red)} .sec-blue{background:var(--blue)} .sec-gold{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.sec-gold h2{color:var(--blue)}
.sec-gold .glyph{color:var(--star)}
.sec .ring{position:absolute;left:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(255,255,255,.12)}

/* lesson list */
.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lesson{border:2px solid var(--line);background:var(--paper);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;text-align:right}
.lesson:hover{border-color:var(--blue)}
.lesson .num{width:48px;height:48px;border-radius:14px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;flex:none}
.lesson .t{font-weight:700;font-size:1.08rem}
.lesson .s{font-size:.85rem;color:var(--muted)}
.lesson .done{margin-inline-start:auto;flex:none;font-size:.82rem;font-weight:700;background:var(--ok-l);color:var(--ok);border-radius:999px;padding:3px 10px;white-space:nowrap}
.lesson .new{margin-inline-start:auto;flex:none;font-size:.82rem;font-weight:700;background:var(--red-l);color:var(--red);border-radius:999px;padding:3px 10px}

/* video + quiz */
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--blue-d)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.drive{aspect-ratio:4/3}
.video video{background:#000;object-fit:contain}
.vfb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;color:#fff;background:#0b1a3a center/cover no-repeat;text-decoration:none}
.vfb::before{content:"";position:absolute;inset:0;background:rgba(10,20,50,.55)}
.vfb>*{position:relative}
.vfb .play{width:78px;height:78px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.vfb b{font-size:1.1rem}
.video:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}
.video:-webkit-full-screen{border-radius:0;width:100%;height:100%}
.vwrap{display:flex;flex-direction:column;gap:8px}
.vtools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.vtools a,.vtools button{border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-size:.9rem;background:var(--blue-l);color:var(--blue);text-decoration:none}
.vph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--paper);text-align:center;padding:16px}
.vph .play{width:72px;height:72px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.vph a{color:var(--paper)}
.quiz{display:flex;flex-direction:column;gap:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:28px;height:8px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--red)} .dots i.cur{background:var(--blue)}
.q{font-family:var(--f-display);font-size:1.55rem;color:var(--ink);line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;font-size:1.15rem;font-weight:700;text-align:right;display:flex;gap:12px;align-items:center;min-height:70px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .k{width:34px;height:34px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none;font-family:var(--f-display)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)} .opt.ok .k{background:var(--ok);color:var(--paper)}
.opt.bad{border-color:var(--red);background:var(--red-l)} .opt.bad .k{background:var(--red);color:var(--paper)}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px 18px;font-weight:700;font-size:1.1rem;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.ok{background:var(--ok-l);color:var(--ok)} .fb.bad{background:var(--red-l);color:var(--red-d)}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px}
.stars{font-size:3rem;letter-spacing:6px;color:var(--line)}
.stars b{color:var(--star);font-weight:400}
.score{font-family:var(--f-display);font-size:3.2rem;color:var(--blue);line-height:1}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:.92rem}
.inp{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);width:100%;font-size:1rem}
.inp:focus{border-color:var(--blue);outline:none}
textarea.inp{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qcard{border:2px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qhead b{color:var(--blue);font-family:var(--f-display);font-size:1.15rem}
.optrow{display:flex;gap:8px;align-items:center}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.optrow .inp{flex:1}
.hint{font-size:.82rem;color:var(--muted)}
.alist{display:flex;flex-direction:column;gap:8px}
.aitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--paper);flex-wrap:wrap}
.aitem .grow{flex:1;min-width:150px}
.tag{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blue-l);color:var(--blue)}
.tag.red{background:var(--red-l);color:var(--red)}
.tag.off{background:var(--line);color:var(--muted)}
.mini{border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:.88rem;background:var(--blue-l);color:var(--blue)}
.mini.del{background:var(--red-l);color:var(--red)}
.mini.sure{background:var(--red);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;color:var(--blue);line-height:1.2}
.stat span{font-size:.85rem;color:var(--muted)}
.res{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.res th,.res td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.res th{color:var(--muted);font-weight:500}
.demo-note{background:var(--red-l);color:var(--red-d);border-radius:14px;padding:10px 14px;font-size:.9rem}
footer{text-align:center;padding-block:10px 30px;color:var(--muted);font-size:.85rem}
footer button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem}

/* alhan, recorder, points */
.sec-navy{background:var(--blue-d)}
.tag.navy{background:var(--blue-d);color:var(--paper)}
.media-audio{background:var(--blue-l);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--blue)}
.media-audio audio{width:100%}
.mload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--paper)}
.mload .spin{border-color:rgba(255,255,255,.25);border-top-color:var(--paper)}
.rec{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:16px 8px}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;transition:transform .12s}
.micbtn:active{transform:scale(.95)}
.micbtn.on{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,38,45,.45)}70%{box-shadow:0 0 0 22px rgba(225,38,45,0)}100%{box-shadow:0 0 0 0 rgba(225,38,45,0)}}
.timer{font-family:var(--f-display);font-size:2.2rem;color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.legend span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.9rem;font-weight:700}
.legend b{color:var(--red);margin-inline-start:4px}
.chips.start{justify-content:flex-start}
.chip.cat b{color:var(--red);margin-inline-start:4px}
.chip.cat[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--paper)}
.chip.cat[aria-pressed="true"] b{color:var(--paper)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.kc{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:700;background:var(--paper)}
.kc:has(input:checked){border-color:var(--blue);background:var(--blue-l)}
.kc input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.kc small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.qbtns{display:flex;gap:4px;justify-content:flex-end}
.qbtns .mini{min-width:44px}
.pts-pos{color:var(--ok)} .pts-neg{color:var(--red)}
.badge{background:var(--red);color:var(--paper);border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
.tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
.tab{white-space:nowrap}
a.mini{text-decoration:none;display:inline-flex;align-items:center}
.stats4{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 .field:first-child{grid-column:1/-1}
  .stats4{grid-template-columns:1fr 1fr}
  .sections{grid-template-columns:1fr}
  .sec{min-height:130px}
  .lessons{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  header.top h1{font-size:1.15rem}
  header.top img{width:50px;height:50px}
  .q{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- engaging layer: avatars, home card, stage leaderboard, bottom nav, attendance ---------- */
.btn-gold{background:linear-gradient(180deg,#ffd45c,#f2ac00);color:#4a3200;box-shadow:0 5px 0 #c98a00;font-size:1.1rem}
.btn-gold:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a00}
.ava{position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;background:var(--c);color:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--paper)}
.ava i{font-style:normal;font-family:var(--f-display);font-size:calc(var(--s) * .44);line-height:1}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--c)}
.ava.ring-1{box-shadow:0 0 0 4px #ffd45c,0 0 0 9px rgba(255,212,92,.3)}
.ava.ring-2{box-shadow:0 0 0 4px #dfe6f1,0 0 0 8px rgba(223,230,241,.25)}
.ava.ring-3{box-shadow:0 0 0 4px #e39a62,0 0 0 8px rgba(227,154,98,.25)}
.name{padding:10px 12px}
.name:active{transform:scale(.97)}
.hright{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.who{margin-inline-start:0;padding:3px 6px 3px 6px}
#whoAva .ava{box-shadow:none}
.mute{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.1rem;flex:none}

.hcard{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hcard::after{content:"";position:absolute;inset:auto -50px -70px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,92,.35),transparent 70%);pointer-events:none}
.hc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hc-main h2{color:#fff;font-size:1.6rem}
.hc-stats{display:flex;gap:8px;flex-wrap:wrap}
.hc-stats span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem}
.hpts b{font-family:var(--f-display);font-size:1.25rem;color:#ffd45c}
.xp{height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f2ac00,#ffd45c);transform-origin:right;animation:grow 1.1s ease-out both}
@keyframes grow{from{transform:scaleX(.2)}}
.xp-note{opacity:.92} .xp-note b{color:#ffd45c}
.skel{opacity:.75}
.newpill{position:absolute;top:14px;left:14px;background:#ffd45c;color:#4a3200;font-weight:800;font-size:.8rem;border-radius:999px;padding:2px 10px;z-index:1}
.sec-gold{background:linear-gradient(135deg,#ffd45c,#f2ac00);color:#4a3200;border:0}
.sec-gold h2,.sec-gold .glyph{color:#4a3200}
.sec .ring{z-index:0}

.stage{position:relative;border-radius:28px;padding:22px 14px 0;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 18% 8%,rgba(255,212,92,.2),transparent 40%),radial-gradient(circle at 88% 28%,rgba(225,38,45,.28),transparent 45%),linear-gradient(170deg,#1f4aa8 0%,#0e2457 72%)}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.6px);background-size:26px 26px;opacity:.16;pointer-events:none}
.stage-head{text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.stage-head h2{color:#fff;font-size:2.1rem}
.trophy{font-size:2.8rem;line-height:1;filter:drop-shadow(0 4px 12px rgba(255,212,92,.55))}
.stage-head p{margin:0;opacity:.78;font-size:.82rem}
.stage .legend span{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.stage .legend b{color:#ffd45c}
.stage-chips{position:relative;margin-top:12px}
.stage-chips .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.stage-chips .chip[aria-pressed="true"]{background:#ffd45c;border-color:#ffd45c;color:#4a3200}

/* Same scoring rule as the server */
function lessonPoints(rules, score, total, section){
  if (section===RECITE) return rules.recite||0;
  return rules.solve + rules.correct*score + (total&&score===total?rules.full:0);
}
function leaderboardFrom(kids, results, rules, bonus){
  const t={};
  kids.filter(k=>k.active!==false).forEach(k=>t[String(k.id)]={kidId:String(k.id),name:String(k.name),class:String(k.class),photo:String(k.photo||''),points:0,lessons:0,bonus:0,bySection:{}});
  const best={};
  results.forEach(r=>{const key=r.kidId+'|'+r.lessonId, s=Number(r.score)||0; if(!best[key]||s>best[key].score) best[key]={kidId:String(r.kidId),section:String(r.section),score:s,total:Number(r.total)||0}});
  Object.values(best).forEach(b=>{const o=t[b.kidId]; if(!o) return;
    const p=lessonPoints(rules,b.score,b.total,b.section); o.points+=p; o.lessons++; o.bySection[b.section]=(o.bySection[b.section]||0)+p;});
  (bonus||[]).forEach(x=>{const o=t[String(x.kidId)]; if(!o) return; const p=Number(x.points)||0;
    o.points+=p; o.bonus+=p; o.bySection[BONUS_KEY]=(o.bySection[BONUS_KEY]||0)+p;});
  return Object.values(t);
}

}

const nkey = s => String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,'');
function photoSrc(p){ p=String(p||''); if(!p) return ''; if(/^(data:|https?:)/.test(p)) return p; return 'https://lh3.googleusercontent.com/d/'+encodeURIComponent(p)+'=s240-c'; }
function avatar(k, size, cls){
  const n=String((k&&k.name)||'').trim(); let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))>>>0;
  const src=photoSrc((k&&k.photo)||PHOTOS[nkey(n)]);
  return `<span class="ava ${cls||''}" style="--s:${size||40}px;--c:${PALETTE[h%PALETTE.length]}"><i>${esc(n[0]||'؟')}</i>${src?`<img src="${esc(src)}" alt="" loading="lazy" data-p="${esc((k&&k.photo)||'')}">`:''}</span>`;
}
/* a photo that won't load: try Drive's thumbnail once, then fall back to the initial */
document.addEventListener('error', e => {
  const im=e.target;
  if(!im||im.tagName!=='IMG'||!im.closest('.ava')) return;
  const p=im.dataset.p||'';
  if(!im.dataset.f && p && !/^(data:|https?:)/.test(p)){ im.dataset.f='1'; im.src='https://drive.google.com/thumbnail?id='+encodeURIComponent(p)+'&sz=w240'; }
  else im.remove();
}, true);

const LEVELS=[{min:0,name:'برونزي',icon:'🥉'},{min:50,name:'فضي',icon:'🥈'},{min:150,name:'ذهبي',icon:'🥇'},{min:300,name:'ماسي',icon:'💎'},{min:500,name:'أسطوري',icon:'👑'}];
function levelOf(p){
  let i=0; LEVELS.forEach((l,j)=>{ if(p>=l.min) i=j; });
  const cur=LEVELS[i], next=LEVELS[i+1];
  return {cur, next, pct: next?Math.max(4,Math.round((p-cur.min)/(next.min-cur.min)*100)):100, left: next?next.min-p:0};
}

function confetti(n){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const ctx=c.getContext&&c.getContext('2d'); if(!ctx){ c.remove(); return; }
  const W=c.width=innerWidth, H=c.height=innerHeight, cols=['#1f4aa8','#e1262d','#f2ac00','#17914e','#ffd166'];
  const ps=Array.from({length:n||90},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.3,vx:(Math.random()-.5)*13,vy:-Math.random()*13-5,s:7+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function frame(){ ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.33; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(++t<150) requestAnimationFrame(frame); else c.remove(); })();
}

let AC=null;
const isMuted=()=>store.get('mute')===true;
function sfx(kind){
  if(isMuted()) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes={ok:[[660,0],[990,.1]],bad:[[260,0],[196,.12]],win:[[523,0],[659,.11],[784,.22],[1047,.34]],tap:[[620,0]]}[kind]||[];
    notes.forEach(([f,t])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=kind==='bad'?'triangle':'sine'; o.frequency.value=f;
      const s=AC.currentTime+t; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.2,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.28);
      o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+.3); });
  }catch(e){}
}
function drawMute(){ const b=$('#muteBtn'); if(b){ b.textContent=isMuted()?'🔇':'🔊'; b.setAttribute('aria-label',isMuted()?'شغّل الصوت':'اكتم الصوت'); } }

/* resize a picked photo to a small square-ish JPEG before uploading */
function resizeImage(file, max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const s=Math.min(1,(max||420)/Math.max(im.width,im.height)); const c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej('ما قدرناش نجهّز الصورة'),'image/jpeg',.86); };
    im.onerror=()=>rej('الملف ده مش صورة');
    im.src=url;
  });
}

/* the leaderboard both the kids and the servants see: same numbers, same order */
async function getBoard(force){ if(force||!S.board) S.board=await api('getLeaderboard'); return S.board; }
function rankRows(B, key, cls){
  const rows=B.rows.map(r=>({...r, pts:key==='all'?r.points:(r.bySection[key]||0)}))
    .filter(r=>(key==='all'||r.pts!==0)&&(cls==='الكل'||r.class===cls))
    .sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name,'ar'));
  let rank=0, prev=null; rows.forEach((r,i)=>{ if(r.pts!==prev){rank=i+1;prev=r.pts} r.rank=rank; });
  return rows;
}
function boardFilters(key, cls){
  const secs=[['all','الكل'],...SECTIONS.map(s=>[s.key,s.title]),[BONUS_KEY,'نقط الحصة']];
  return `<div class="chips stage-chips">${secs.map(([k,t])=>`<button type="button" class="chip" aria-pressed="${k===key}" data-k="${esc(k)}">${t}</button>`).join('')}</div>
    <div class="chips stage-chips">${['الكل',...CLASSES].map(c=>`<button type="button" class="chip" aria-pressed="${c===cls}" data-c="${esc(c)}">${c==='الكل'?'كل الفصول':esc(c)}</button>`).join('')}</div>`;
}
function podiumHTML(rows){
  const top=rows.filter(r=>r.pts>0);
  if(!top.length) return '<p class="stage-empty">لسه محدش خد نقط هنا. مين هيبقى الأول؟ ✨</p>';
  const slot=(r,place)=>r?`<div class="pod p${place}" style="--i:${place}">
      ${place===1?'<span class="crown" aria-hidden="true">👑</span>':''}
      ${avatar(r, place===1?92:72, 'ring-'+place)}
      <div class="nm">${esc(r.name)}</div>
      <div class="pt">${r.pts}<small> نقطة</small></div>
      <div class="block"><b>${r.rank}</b></div></div>`:'<div class="pod empty"></div>';
  return `<div class="podium">${slot(top[1],2)}${slot(top[0],1)}${slot(top[2],3)}</div>`;
}
function rowsHTML(rows, opts){
  const max=Math.max(1,...rows.map(r=>r.pts));
  const me=S.kid?String(S.kid.id):'';
  return `<div class="lboard">${rows.map((r,i)=>{
    const parts=opts.admin?[['دروس',(r.bySection['قبطي']||0)+(r.bySection['طقس']||0)],['ألحان',r.bySection[RECITE]||0],['حصة',r.bySection[BONUS_KEY]||0]].filter(x=>x[1]).map(x=>`${x[0]} ${x[1]}`).join(' · '):'';
    return `<div class="lrow ${r.kidId===me?'me':''} ${r.rank<=3&&r.pts>0?'top'+r.rank:''}" style="--i:${Math.min(i,20)}">
      <span class="lrk">${r.rank}</span>${avatar(r,46)}
      <div class="lname"><b>${esc(r.name)}${r.kidId===me?' <span class="you">إنت</span>':''}</b>
        <small>${esc(r.class)}${parts?' · '+parts:''}</small>
        <span class="lbar"><i style="width:${Math.max(0,Math.round(r.pts/max*100))}%"></i></span></div>
      <div class="lpts"><b>${r.pts}</b><small>نقطة</small></div>
      ${opts.admin?`<div class="qbtns"><button type="button" class="mini del" data-q="${esc(r.kidId)}" data-n="-1" aria-label="ناقص نقطة">−1</button><button type="button" class="mini" data-q="${esc(r.kidId)}" data-n="1">+1</button><button type="button" class="mini" data-q="${esc(r.kidId)}" data-n="5">+5</button></div>`:''}
    </div>`; }).join('')}</div>`;
}
function stageHTML(B, key, cls, opts){
  const rows=rankRows(B,key,cls);
  const legend=(B.cats||[]).map(c=>`<span>${esc(c.name)} <b>${signed(c.points)}</b></span>`).join('');
  const listRows=rows;
  return `<div class="stage">
      <div class="stage-head"><span class="trophy" aria-hidden="true">🏆</span><h2>لوحة الأبطال</h2>
        ${legend?`<div class="legend">${legend}</div>`:''}
        <p>${esc(rulesText(B.rules||{}))}</p></div>
      ${boardFilters(key,cls)}
      ${podiumHTML(rows)}
    </div>
    ${listRows.length?rowsHTML(listRows,opts):''}`;
}

/* ===================== MEDIA (YouTube / Drive / files) ===================== */
function videoEmbed(url){
  url=(url||'').trim(); let m;
  if ((m=url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) return {kind:'yt',src:'https://www.youtube.com/embed/'+m[1]+'?rel=0&modestbranding=1&playsinline=1'};
  if ((m=url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/))) return {kind:'drive',id:m[1],src:'https://drive.google.com/file/d/'+m[1]+'/preview'};
  if (/\.(mp4|webm|mp3|m4a|ogg|wav)(\?|$)/i.test(url)) return {kind:'file',src:url,audio:/\.(mp3|m4a|ogg|wav)(\?|$)/i.test(url)};
  return url ? {kind:'link',src:url} : null;
}
/* ctx = {lesson, q} lets the server send a Drive file so it plays inside the page */
function videoHTML(url, ctx){
  const v=videoEmbed(url);
  if (!v) return '';
  if (LIVE && v.kind==='drive') {
    const view='https://drive.google.com/file/d/'+encodeURIComponent(v.id)+'/view';
    const m=esc(JSON.stringify({l:ctx?ctx.lesson:'',q:ctx?ctx.q:-1,id:v.id}));
    return `<div class="vwrap" data-media="${m}"><div class="video drive"><div class="mload"><div class="spin"></div><span>جاري التحميل…</span></div></div>
    <div class="vtools"><button type="button" data-fs>⛶ ملو الشاشة</button><a href="${esc(view)}" target="_blank" rel="noopener">افتح في Drive</a></div></div>`;
  }
  if (LIVE && v.kind==='yt') return `<div class="vwrap"><div class="video yt"><iframe src="${esc(v.src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="فيديو"></iframe></div>
    <div class="vtools"><button type="button" data-fs>⛶ ملو الشاشة</button><a href="${esc(url)}" target="_blank" rel="noopener">افتح في YouTube</a></div></div>`;
  if (v.kind==='file') return v.audio ? `<div class="media-audio"><b>🎧 اسمع</b><audio controls preload="metadata" src="${esc(v.src)}"></audio></div>`
    : `<div class="vwrap"><div class="video"><video src="${esc(v.src)}" controls playsinline></video></div><div class="vtools"><button type="button" data-fs>⛶ ملو الشاشة</button></div></div>`;

    <b>الفيديو هيشتغل هنا في الموقع الحقيقي</b><a href="${esc(url)}" target="_blank" rel="noopener">افتح الفيديو في صفحة جديدة</a></div></div>`;
}
const mediaCache={};
function hydrateMedia(root){
  (root||document).querySelectorAll('.vwrap[data-media]:not([data-done])').forEach(async w=>{
    w.dataset.done='1';
    const m=JSON.parse(w.dataset.media); const box=w.querySelector('.video');
    try{
      let r=mediaCache[m.id];
      if(!r){ if(!m.l) throw 0;
        const d=await api('getMedia', m.l, m.q);
        if(!d||d.tooBig||!d.data) throw 0;
        r=mediaCache[m.id]={url:URL.createObjectURL(b64ToBlob(d.data,d.mime)), mime:String(d.mime||'')}; }
      if(!box.isConnected) return;
      if(/^audio\//.test(r.mime)){
        const fs=w.querySelector('[data-fs]'); if(fs) fs.remove();
        box.className='media-audio'; box.innerHTML=`<b>🎧 اسمع</b><audio controls preload="auto" src="${r.url}"></audio>`;
      } else box.innerHTML=`<video controls playsinline preload="metadata" src="${r.url}"></video>`;
    }catch(e){
      if(!box.isConnected) return;
      const thumb='https://drive.google.com/thumbnail?id='+encodeURIComponent(m.id)+'&sz=w1000';
      const view='https://drive.google.com/file/d/'+encodeURIComponent(m.id)+'/view';
      box.innerHTML=`<video controls playsinline preload="metadata" poster="${esc(thumb)}" data-view="${esc(view)}" data-thumb="${esc(thumb)}" src="${esc('https://drive.google.com/uc?export=download&id='+encodeURIComponent(m.id))}"></video>`;
    }
  });
}

/* ===================== RECORDER (kids' recitation + servant's voice) ===================== */
let REC=null;
function killRec(){ if(REC){ try{ if(REC.mr && REC.mr.state!=='inactive'){ REC.cancelled=true; REC.mr.stop(); } }catch(e){} try{ REC.stream&&REC.stream.getTracks().forEach(t=>t.stop()); }catch(e){} clearInterval(REC.timer); REC=null; } }
function recSupported(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); }
/* opts: {startLabel, doneLabel, onSubmit(blob, secs, setStatus)} */
function mountRecorder(el, opts){
  const idle=()=>{ el.innerHTML=`<div class="rec"><button type="button" class="micbtn" data-r="go" aria-label="${esc(opts.startLabel)}">${ICON_MIC}</button><b>${esc(opts.startLabel)}</b></div>`;
    el.querySelector('[data-r="go"]').onclick=start; };
  const fail=(msg)=>{ el.innerHTML=`<div class="rec"><p class="fb bad" style="margin:0">${msg}</p><button type="button" class="btn btn-soft" data-r="retry">جرّب تاني</button></div>`;
    el.querySelector('[data-r="retry"]').onclick=idle; };
  async function start(){
    if(!recSupported()) return fail('الجهاز أو المتصفح ده مش بيدعم التسجيل. افتح الموقع من Chrome على الموبايل.');
    killRec();
    let stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
    catch(e){ return fail('محتاجين إذن المايكروفون. دوس على علامة القفل 🔒 جنب اللينك فوق، واسمح بالمايكروفون، وبعدين جرّب تاني.'); }
    const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    const type=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    let mr; try{ mr=new MediaRecorder(stream, type?{mimeType:type,audioBitsPerSecond:48000}:{}); }catch(e){ mr=new MediaRecorder(stream); }
    const R=REC={mr,stream,chunks:[],start:Date.now(),timer:null};
    mr.ondataavailable=ev=>{ if(ev.data&&ev.data.size) R.chunks.push(ev.data); };
    mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(R.timer); if(R.cancelled||!el.isConnected) return;
      const blob=new Blob(R.chunks,{type:(mr.mimeType||type||'audio/webm')}); const secs=(Date.now()-R.start)/1000; REC=null; review(blob,secs); };
    mr.start(1000);
    el.innerHTML=`<div class="rec"><button type="button" class="micbtn on" data-r="stop" aria-label="وقّف التسجيل">${ICON_STOP}</button>
      <div class="timer" data-r="t">0:00</div><b>بيسجّل… دوس على المربع لما تخلص</b></div>`;
    el.querySelector('[data-r="stop"]').onclick=()=>{ try{ mr.stop(); }catch(e){} };
    R.timer=setInterval(()=>{ const s=(Date.now()-R.start)/1000; const t=el.querySelector('[data-r="t"]'); if(t) t.textContent=fmtSecs(s); if(s>=MAX_REC_SECS){ try{ mr.stop(); }catch(e){} } },500);
  }
  function review(blob,secs){
    const url=URL.createObjectURL(blob);
    el.innerHTML=`<div class="rec"><p style="margin:0;font-weight:700">اسمع تسجيلك (${fmtSecs(secs)})</p><audio controls src="${url}" style="width:100%"></audio>
      <div class="row" style="justify-content:center"><button type="button" class="btn btn-red btn-big" data-r="ok">${esc(opts.doneLabel)}</button>
      <button type="button" class="btn btn-soft" data-r="again">🎙 سجّل تاني</button></div><p class="muted" data-r="st" style="margin:0"></p></div>`;
    el.querySelector('[data-r="again"]').onclick=start;
    const ok=el.querySelector('[data-r="ok"]');
    ok.onclick=async()=>{
      if(secs<2){ toast('التسجيل قصير أوي، سجّل تاني'); return; }
      ok.disabled=true; el.querySelector('[data-r="again"]').disabled=true;
      const st=m=>{ const x=el.querySelector('[data-r="st"]'); if(x) x.textContent=m; };
      st('جاري رفع التسجيل… استنى ثواني');
      try{ await opts.onSubmit(blob,secs,st); }
      catch(e){ ok.disabled=false; el.querySelector('[data-r="again"]').disabled=false; st('ما اترفعش التسجيل ('+e+'). دوس تاني.'); }
    };
  }
  idle();
}

      <h2 class="title-xl">أهلاً يا شماس!</h2><p class="lead">دوّر على اسمك أو صورتك واضغط عليها عشان تبدأ</p></div>
    <div class="chips" role="group" aria-label="الفصل">${classes.map(c=>`<button type="button" class="chip" aria-pressed="${c===S.classFilter}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <input class="search" id="kidSearch" type="search" placeholder="اكتب اسمك…" value="${esc(S.search)}" autocomplete="off">
    <div class="names" id="names"></div>
    <div style="text-align:center"><button type="button" class="btn btn-gold" id="pickBoard">🏆 شوف لوحة الأبطال</button></div></section>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.classFilter=b.dataset.c; showPicker();});
  const s=$('#kidSearch'); s.oninput=()=>{S.search=s.value; drawNames();};
  $('#pickBoard').onclick=showBoard;
  drawNames();
}
function drawNames(){
  const q=S.search.trim();
  const list=S.data.kids.filter(k=>(S.classFilter==='الكل'||k.class===S.classFilter)&&(!q||String(k.name).includes(q)))
    .sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
  $('#names').innerHTML = list.length ? list.map(k=>`<button type="button" class="name" data-id="${esc(k.id)}">${avatar(k,52)}<span>${esc(k.name)}<small>${esc(k.class)}</small></span></button>`).join('')
    : `<div class="empty" style="grid-column:1/-1">مش لاقي اسمك؟ قول للخادم يضيفه.</div>`;
  $('#names').querySelectorAll('.name').forEach(b=>b.onclick=()=>{ sfx('tap'); selectKid(b.dataset.id); });
}
async function selectKid(id){
  S.kid=S.data.kids.find(k=>String(k.id)===String(id)); store.set('kid',S.kid.id);
  $('#whoName').textContent=S.kid.name.split(' ')[0]; $('#whoAva').innerHTML=avatar(S.kid,30); $('#who').hidden=false;
  try { S.progress = await api('getKidProgress', S.kid.id); } catch(e){ S.progress={}; }
  showHome();
}
function changeKid(){ store.set('kid',null); S.search=''; showPicker(); }
$('#changeKid').onclick=changeKid;

/* ===================== HOME ===================== */
function showHome(){
  killRec(); S.inAdmin=false; setNav('home');
  const count = key => S.data.lessons.filter(l=>l.section===key).length;
  const fresh = key => S.data.lessons.filter(l=>l.section===key&&!S.progress[l.id]).length;
  app.innerHTML=`<section class="view">
    <div class="hcard" id="hcard">${avatar(S.kid,84,'ring-1')}<div class="hc-main"><h2>أهلاً يا ${esc(S.kid.name.split(' ')[0])} 👋</h2><div class="hc-stats"><span class="skel">جاري حساب نقطك…</span></div></div></div>
    <p class="lead" style="margin:0">اختار اللي عايز تعمله النهارده</p>
    <div class="sections">
      ${SECTIONS.map(s=>{const n=fresh(s.key); return `<button type="button" class="sec ${s.cls}" data-s="${esc(s.key)}"><span class="ring"></span>${n?`<span class="newpill">${n} جديد</span>`:''}<span class="glyph">${s.glyph}</span><h2>${s.title}</h2><p>${s.sub} · ${count(s.key)} ${s.recite?'لحن':'درس'}</p></button>`;}).join('')}
      <button type="button" class="sec sec-gold" id="goBoard"><span class="ring"></span><span class="glyph">🏆</span><h2>الأبطال</h2><p>مين الأول في النقط؟</p></button>
    </div></section>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ sfx('tap'); showSection(b.dataset.s); });
  $('#goBoard').onclick=showBoard;
  goTop();
  getBoard().then(B=>{
    const hc=$('#hcard'); if(!hc||!S.kid) return;
    const rows=rankRows(B,'all','الكل'), me=rows.find(r=>r.kidId===String(S.kid.id));
    const pts=me?me.points:0;
    hc.querySelector('.hc-stats').innerHTML=`<span class="hpts"><b>${pts}</b> نقطة</span>${me?`<span class="hrank">🏆 الترتيب #${me.rank} من ${rows.length}</span>`:''}`;
  }).catch(()=>{ const s=$('#hcard .hc-stats'); if(s) s.innerHTML=''; });
}

/* ===================== SECTION ===================== */
function showSection(key){
  killRec(); setNav('home');
  const sec=SECTIONS.find(s=>s.key===key);
  const ls=S.data.lessons.filter(l=>l.section===key);
  app.innerHTML=`<section class="view">
    <button class="back" type="button" id="bk">→ رجوع</button>
    <div><h2 class="title-xl">${sec.title}</h2><p class="lead">${sec.sub}</p></div>
    <div class="lessons">${ls.length?ls.map((l,i)=>{const p=S.progress[l.id];
      const sub=sec.recite?'اسمع وسمّع':`${l.questions.length} أسئلة`;
      const badge=p?(sec.recite?'<span class="done">✓ سمّعت</span>':`<span class="done">✓ ${p.score} من ${p.total}</span>`):'<span class="new">جديد</span>';
      return `<button type="button" class="lesson" data-id="${esc(l.id)}"><span class="num">${sec.recite?'♪':i+1}</span><span><span class="t">${esc(l.title)}</span><br><span class="s">${sub}</span></span>${badge}</button>`}).join('')
      :`<div class="card empty" style="grid-column:1/-1">لسه مفيش ${sec.recite?'ألحان':'دروس'} هنا. استنى الجديد قريب!</div>`}</div></section>`;
  $('#bk').onclick=showHome;
  app.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>showLesson(b.dataset.id));
  goTop();
}

/* ===================== LESSON + QUIZ ===================== */
let Q=null;
function showLesson(id){
  killRec();
  const l=S.data.lessons.find(x=>x.id===id);
  if (l.section===RECITE) return showRecite(l);
  Q={lesson:l, i:0, answers:[]};
  app.innerHTML=`<section class="view">
    <button class="back" type="button" id="bk">→ رجوع للدروس</button>
    <div><span class="tag ${l.section==='قبطي'?'red':''}">${esc(secTitle(l.section))}</span>
      <h2 class="title-xl" style="margin-top:6px">${esc(l.title)}</h2>${l.description?`<p class="lead">${esc(l.description)}</p>`:''}</div>
    <div id="lessonIntro">${videoHTML(l.videoUrl,{lesson:l.id,q:-1})}</div>
    <div id="quizArea" style="display:flex;justify-content:center">
      ${l.questions.length?`<button type="button" class="btn btn-red btn-big" id="startQ">${l.videoUrl?'خلصت الفيديو؟ يلا نجاوب ←':'يلا نبدأ ←'}</button>`:'<p class="muted">الدرس ده مفيهوش أسئلة لسه.</p>'}
    </div></section>`;
  $('#bk').onclick=()=>showSection(l.section);
  const st=$('#startQ'); if(st) st.onclick=()=>{ const li=$('#lessonIntro'); if(li){ li.innerHTML=''; li.hidden=true; } drawQuestion(); goTop(); };
  hydrateMedia(app); goTop();
}
function drawQuestion(){
  const l=Q.lesson, q=l.questions[Q.i];
  const dots=l.questions.map((_,i)=>{const a=Q.answers[i]; return `<i class="${a?(a.ok?'ok':'bad'):(i===Q.i?'cur':'')}"></i>`}).join('');
  $('#quizArea').style.display='block';
  $('#quizArea').innerHTML=`<div class="card quiz">
    <div class="row" style="justify-content:space-between"><span class="muted">سؤال ${Q.i+1} من ${l.questions.length}</span><div class="dots">${dots}</div></div>
    ${q.videoUrl?`<div class="view" style="gap:8px">${videoHTML(q.videoUrl,{lesson:l.id,q:Q.i})}<p class="muted" style="margin:0">▶ اتفرج على الفيديو وبعدين جاوب</p></div>`:''}
    <div class="q">${esc(q.question)}</div>
    <div class="opts">${q.options.map((o,i)=>`<button type="button" class="opt" data-i="${i}"><span class="k">${AR[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`;
  $('#quizArea').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(Number(b.dataset.i)));
  hydrateMedia($('#quizArea'));
}
function pick(i){
  if (Q.answers[Q.i]) return;
  const q=Q.lesson.questions[Q.i], ok=i===q.correct;
  Q.answers[Q.i]={q:Q.i, chosen:i, ok};
  sfx(ok?'ok':'bad'); if(ok) confetti(40);
  $('#quizArea').querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===q.correct) b.classList.add('ok'); else if(j===i) b.classList.add('bad'); });
  const last=Q.i===Q.lesson.questions.length-1;
  const nextLbl=last?'شوف نتيجتك ←':'السؤال اللي بعده ←';
  $('#fb').innerHTML= ok
    ? `<div class="fb ok"><span>برافو عليك! إجابة صح 🎉</span><button type="button" class="btn btn-blue" id="nx">${nextLbl}</button></div>`
    : `<div class="fb bad"><span>مش مظبوطة. الإجابة الصح: «${esc(q.options[q.correct])}»</span><button type="button" class="btn btn-blue" id="nx">${nextLbl}</button></div>`;
  $('#quizArea').querySelectorAll('.dots i')[Q.i].className = ok?'ok':'bad';
  $('#nx').onclick=()=>{ if(last) finish(); else { Q.i++; drawQuestion(); } };
  $('#nx').focus({preventScroll:true});
}
async function finish(){
  const l=Q.lesson, total=l.questions.length, score=Q.answers.filter(a=>a&&a.ok).length;
  const pct=total?score/total:0, stars=pct>=.9?3:pct>=.6?2:score>0?1:0;
  if(stars>=2){ sfx('win'); confetti(stars===3?150:90); }
  const msg=stars===3?'ممتاز! إنت بطل 🏆':stars===2?'شاطر جدًا! كمّل كده':stars===1?'كويس! اتفرج على الفيديو تاني وجرّب':'ولا يهمك، اتفرج على الفيديو تاني وحاول';
  const R=S.data.rules||{solve:0,correct:1,full:0}, p=lessonPoints(R,score,total), prev=S.progress[l.id];
  const ptsMsg=!prev?`<p style="margin:0;font-weight:700;color:var(--red)">كسبت ${nq(p)} ★</p>`
    : score>prev.score?`<p style="margin:0;font-weight:700;color:var(--red)">حسّنت درجتك! نقطك في الدرس ده بقت ${nq(p)}</p>`
    : `<p class="muted" style="margin:0">الدرس ده اتحسبلك قبل كده، والنقط بتتحسب من أحسن محاولة</p>`;
  $('#quizArea').innerHTML=`<div class="card result">
    <div class="stars">${[1,2,3].map(n=>n<=stars?'<b>★</b>':'★').join('')}</div>
    <div class="score">${score} / ${total}</div><h3 style="color:var(--blue)">${msg}</h3>${ptsMsg}
    <p class="muted" id="saveSt">جاري تسجيل إجابتك…</p>
    <div class="row" style="justify-content:center"><button type="button" class="btn btn-soft" id="again">جرّب الدرس تاني</button>
    <button type="button" class="btn btn-blue" id="toSec">باقي الدروس</button><button type="button" class="btn btn-line" id="toBoard">★ الأبطال</button></div></div>`;
  $('#again').onclick=()=>showLesson(l.id);
  $('#toSec').onclick=()=>showSection(l.section);
  $('#toBoard').onclick=showBoard;
  const save=async()=>{
    try{
      const r=await api('submitResult',{kidId:S.kid.id, lessonId:l.id, answers:Q.answers.map(a=>({q:a.q,chosen:a.chosen}))});
      $('#saveSt').textContent='✓ اتسجلت إجابتك';
      const b=S.progress[l.id]; if(!b||r.score>b.score) S.progress[l.id]={score:r.score,total:r.total};
      S.board=null;
    }catch(e){
      $('#saveSt').innerHTML=`ما اتسجلتش الإجابة (${esc(e)}). <button type="button" class="mini" id="retry">حاول تاني</button>`;
      $('#retry').onclick=()=>{ $('#saveSt').textContent='جاري تسجيل إجابتك…'; save(); };
    }
  };
  save();
}

const catShort=n=>String(n).replace(/^حضور\s*/,'');
function pickDay(list, today){
  if(!list||!list.length) return today;
  const past=list.filter(x=>x<=today); return past.length?past[past.length-1]:list[0];
}
async function paneAtt(d){
  const today=d.today||new Date().toLocaleDateString('en-CA');
  const days=d.attDates||[];
  const A=S.admin.af||(S.admin.af={day:pickDay(days,today), cls:'الكل', q:'', marks:null, forDay:''});
  const cats=(d.cats||[]).filter(c=>c.att);
  const kids=activeKids(d);
  const pane=$('#pane');
  if(!cats.length){ pane.innerHTML='<div class="card">مفيش أنواع حضور. من «الإعدادات» علّم على «حضور» جنب «حضور القداس» و«حضور الحصة».</div>'; return; }
  const load=async()=>{
    pane.innerHTML='<div class="loading"><div class="spin"></div>جاري تحميل الحضور…</div>';
    try{ const r=await api('adminGetAttendance',S.admin.pw,A.day); A.marks={}; r.marks.forEach(m=>{ A.marks[m.kidId+'|'+m.reason]=m.id; }); A.forDay=A.day; draw(); }
    catch(e){ pane.innerHTML=`<div class="card empty">ما قدرناش نحمّل الحضور. ${esc(e)}</div>`; }
  };
  const isOn=(k,c)=>!!A.marks[k.id+'|'+c.name];
  const draw=()=>{
    const shown=kids.filter(k=>(A.cls==='الكل'||k.class===A.cls)&&(!A.q||String(k.name).includes(A.q)));
    const inSheet=!days.length||days.includes(A.day);
    const i=days.indexOf(A.day);
    pane.innerHTML=`<div class="view">
      <div class="card view" style="gap:14px">
        <div class="dayrow">
          <button type="button" class="mini" id="dPrev" ${days.length&&i<=0?'disabled':''} aria-label="الجمعة اللي قبلها">→</button>
          ${days.length?`<select class="inp" id="aDay">${days.map(x=>`<option value="${x}" ${x===A.day?'selected':''}>${esc(fmtDay(x))}${x===today?' (النهارده)':''}</option>`).join('')}</select>`
            :`<input class="inp" id="aDay" type="date" value="${esc(A.day)}">`}
          <button type="button" class="mini" id="dNext" ${days.length&&i>=days.length-1?'disabled':''} aria-label="الجمعة اللي بعدها">←</button>
        </div>
        ${inSheet?'':'<p class="demo-note" style="margin:0">اليوم ده مش في صفحة الغياب، فالنقط هتتسجل بس من غير ما تتكتب في الصفحة.</p>'}
        <div class="attsum">${cats.map(c=>{ const n=kids.filter(k=>isOn(k,c)).length; return `<div class="attstat"><span>${catIcon(c.name)} ${esc(catShort(c.name))}</span><b>${n}<small> / ${kids.length}</small></b><span class="hint">${signed(c.points)} لكل واحد</span></div>`; }).join('')}</div>
        <div class="row" style="justify-content:space-between">
          <div class="chips start">${['الكل',...CLASSES].map(c=>`<button type="button" class="chip" aria-pressed="${c===A.cls}" data-ac="${esc(c)}">${c==='الكل'?'كل الفصول':esc(c)}</button>`).join('')}</div>
          <input class="inp" id="aSearch" type="search" placeholder="دوّر على اسم…" value="${esc(A.q)}" style="max-width:240px">
        </div>
        <div class="row">${cats.map((c,ci)=>`<button type="button" class="mini" data-all="${ci}">${catIcon(c.name)} كل اللي ظاهرين حضروا ${esc(catShort(c.name))}</button>`).join('')}</div>
      </div>
      <div class="attlist">${shown.map(k=>`<div class="attrow" data-k="${esc(k.id)}">${avatar(k,46)}<div class="an"><b>${esc(k.name)}</b><small>${esc(k.class)}</small></div>
        <div class="attbtns">${cats.map((c,ci)=>{ const on=isOn(k,c); return `<button type="button" class="attbtn ${on?'on':''}" data-t="${ci}" aria-pressed="${on}">${catIcon(c.name)} ${esc(catShort(c.name))}<em>${on?'✓ حضر':'غايب'}</em></button>`; }).join('')}</div></div>`).join('')||'<p class="muted card">مفيش أسماء.</p>'}</div>
      <div class="card view" style="gap:8px">
        <h3 style="color:var(--blue)">الحضور القديم</h3>

    $('#dNext').onclick=()=>{ if(days.length){ if(i<days.length-1) go(days[i+1]); } else { const x=new Date(A.day+'T12:00:00'); x.setDate(x.getDate()+7); go(x.toLocaleDateString('en-CA')); } };

      const k=kids.find(x=>x.id===b.closest('.attrow').dataset.k), c=cats[Number(b.dataset.t)];
      setAtt([k], c, !isOn(k,c));
    });

        A.forDay=''; load(); }
      catch(e){ toast(e); b.disabled=false; b.textContent='📥 احسب الحضور القديم من صفحة الغياب'; } };
  };
  /* optimistic: the button flips right away, the sheet + points follow; flips back if it fails */
  const setAtt=async(list, c, on)=>{
    const day=A.day;
    list.forEach(k=>{ if(on) A.marks[k.id+'|'+c.name]='pending'; else delete A.marks[k.id+'|'+c.name]; });
    if(on) sfx('ok'); draw();
    try{
      const r=await api('adminSetAttendance',S.admin.pw,list.map(k=>k.id),day,c.name,on);
      if(A.day===day){ (r.added||[]).forEach(m=>{ A.marks[m.kidId+'|'+m.reason]=m.id; }); draw(); }
      S.board=null; S.admin.lb=null;
      if(r.warn) toast(r.warn); else if(list.length>1) toast(`اتسجّل ${list.length} حضور ${catShort(c.name)}`);
    }catch(e){
      if(A.day===day){ list.forEach(k=>{ if(on) delete A.marks[k.id+'|'+c.name]; else A.marks[k.id+'|'+c.name]='x'; }); draw(); }
      toast('ما اتسجّلش: '+e);
    }
  };
  if(A.marks&&A.forDay===A.day) draw(); else load();
}

function paneBonus(d){
  const cats=d.cats||[];
  const F=S.admin.bf||(S.admin.bf={cat:cats.length?0:-1, reason:cats[0]?cats[0].name:'', points:cats[0]?cats[0].points:'', date:d.today||new Date().toLocaleDateString('en-CA'), cls:'الكل', sel:[], q:''});

          ${cats.map((c,i)=>`<button type="button" class="chip cat" aria-pressed="${F.cat===i}" data-cat="${i}">${esc(c.name)} <b>${signed(c.points)}</b></button>`).join('')}

        <div id="berr" style="color:var(--red);font-weight:700"></div>
        <button type="button" class="btn btn-red btn-big" id="addB" ${F.sel.length&&Math.round(Number(F.points)||0)?'':'disabled'}>${btnText()}</button>

      <div class="card view" style="gap:10px">
        <h3 style="color:var(--blue)">السجل</h3>
        ${(d.bonus||[]).length?`<div class="alist">${d.bonus.slice(0,200).map(b=>`<div class="aitem"><div class="grow"><b>${esc(b.kidName)}</b> <span class="hint">${esc(b.class)}</span><br><span class="hint">${esc(fmtDay(b.date))} · ${esc(b.reason)}</span></div>
          <b class="${Number(b.points)<0?'pts-neg':'pts-pos'}">${signed(Number(b.points)||0)}</b><button type="button" class="mini del" data-delb="${esc(b.id)}">إلغاء</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">لسه مفيش نقط اتضافت.</p>'}
      </div></div>`;
    const refreshBtn=()=>{ const b=$('#addB'); b.disabled=!(F.sel.length&&Math.round(Number(F.points)||0)); b.textContent=btnText(); };
    pane.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.cat); F.cat=i;
      if(i>=0){ F.reason=cats[i].name; F.points=cats[i].points; } else { F.reason=''; F.points=''; } draw(); });
    $('#bReason').oninput=e=>{ F.reason=e.target.value; };
    $('#bPts').oninput=e=>{ F.points=e.target.value; refreshBtn(); };
    $('#bDate').onchange=e=>{ F.date=e.target.value; };
    pane.querySelectorAll('[data-bc]').forEach(b=>b.onclick=()=>{ F.cls=b.dataset.bc; draw(); });
    $('#selAll').onclick=()=>{ const s=new Set(F.sel); shown.forEach(k=>s.add(k.id)); F.sel=[...s]; draw(); };
    $('#selNone').onclick=()=>{ F.sel=[]; draw(); };
    $('#bSearch').oninput=e=>{ F.q=e.target.value; clearTimeout(F.t); F.t=setTimeout(()=>{ draw(); const i=$('#bSearch'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },300); };
    pane.querySelectorAll('.kc input').forEach(c=>c.onchange=()=>{ const s=new Set(F.sel); c.checked?s.add(c.dataset.k):s.delete(c.dataset.k); F.sel=[...s]; refreshBtn(); });
    $('#addB').onclick=async()=>{ const b=$('#addB'); const p2=Math.round(Number(F.points)||0);
      if(!F.reason.trim()) { $('#berr').textContent='اكتب السبب.'; return; }
      b.disabled=true; b.textContent='جاري الإضافة…';
      try{ await adminCall('adminAddBonus',F.sel,F.reason.trim(),p2,F.date); toast(`اتضاف ${signed(p2)} لـ ${F.sel.length}`); F.sel=[]; paneBonus(S.admin.data); }
      catch(e){ $('#berr').textContent=e; b.disabled=false; b.textContent=btnText(); } };
    pane.querySelectorAll('[data-delb]').forEach(b=>twoStep(b,'متأكد؟',async()=>{ const y=window.scrollY;
      try{ await adminCall('adminDeleteBonus',b.dataset.delb); S.admin.af=null; paneBonus(S.admin.data); window.scrollTo(0,y); toast('اتلغت'); }catch(e){ toast(e); } }));
  };
  draw();
}

/* --- recordings --- */
const recCache={};
function paneRecs(d){
  const F=S.admin.rcf||(S.admin.rcf={st:'new',cls:'الكل',lesson:'all',q:''});
  const heard=r=>r.heard===true||String(r.heard).toLowerCase()==='true';
  const recs=d.recordings||[];
  const lessonsR=d.lessons.filter(l=>l.section===RECITE);
  const draw=()=>{
    const rows=recs.filter(r=>(F.st==='all'||(F.st==='new'?!heard(r):heard(r)))&&(F.cls==='الكل'||r.class===F.cls)&&(F.lesson==='all'||r.lessonId===F.lesson)&&(!F.q||String(r.kidName).includes(F.q)));
    const nNew=recs.filter(r=>!heard(r)).length;
    $('#pane').innerHTML=`<div class="view">
      <div class="stats"><div class="stat"><b>${recs.length}</b><span>تسميع كلّه</span></div><div class="stat"><b>${nNew}</b><span>لسه ما اتسمعش</span></div><div class="stat"><b>${new Set(recs.map(r=>r.kidId)).size}</b><span>طفل سمّع</span></div></div>
      <div class="card view" style="gap:12px">
        <div class="chips start">${[['new','جديد'],['heard','اتسمع'],['all','الكل']].map(([k,t])=>`<button type="button" class="chip" aria-pressed="${F.st===k}" data-st="${k}">${t}</button>`).join('')}</div>
        <div class="row"><select class="inp" id="rcCls" style="width:auto"><option>الكل</option>${CLASSES.map(c=>`<option ${F.cls===c?'selected':''}>${c}</option>`).join('')}</select>
          <select class="inp" id="rcL" style="width:auto;max-width:100%"><option value="all">كل الألحان</option>${lessonsR.map(l=>`<option value="${esc(l.id)}" ${F.lesson===l.id?'selected':''}>${esc(l.title)}</option>`).join('')}</select>
          <input class="inp" id="rcQ" type="search" placeholder="دوّر باسم طفل" value="${esc(F.q)}" style="flex:1;min-width:150px"></div>
        ${rows.length?`<div class="alist">${rows.map(r=>`<div class="aitem rec-item" data-id="${esc(r.id)}">
          <div class="grow"><b>${esc(r.kidName)}</b> <span class="hint">${esc(r.class)}</span><br><span class="hint">${esc(r.lessonTitle)} · ${esc(fmtTime(r.timestamp))} · ${fmtSecs(r.seconds)}</span></div>
          ${heard(r)?'<span class="tag">✓ اتسمع</span>':'<span class="tag red">جديد</span>'}
          <button type="button" class="mini" data-play="${esc(r.id)}">▶ اسمع</button>
          <button type="button" class="mini" data-mark="${esc(r.id)}" data-v="${heard(r)?'0':'1'}">${heard(r)?'رجّعه جديد':'✓ اتسمع'}</button>
          ${r.fileUrl?`<a class="mini" href="${esc(r.fileUrl)}" target="_blank" rel="noopener">Drive</a>`:''}
          <div class="pl" style="flex-basis:100%"></div></div>`).join('')}</div>`:`<p class="muted" style="margin:0">${recs.length?'مفيش تسميع بالفلتر ده.':'لسه محدش سمّع. أول ما طفل يسجّل هيظهر هنا.'}</p>`}
      </div></div>`;
    $('#pane').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ F.st=b.dataset.st; draw(); });
    $('#rcCls').onchange=e=>{ F.cls=e.target.value; draw(); };
    $('#rcL').onchange=e=>{ F.lesson=e.target.value; draw(); };
    $('#rcQ').oninput=e=>{ F.q=e.target.value; clearTimeout(F.t); F.t=setTimeout(()=>{ draw(); const i=$('#rcQ'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },300); };
    $('#pane').querySelectorAll('[data-play]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.play, pl=b.closest('.aitem').querySelector('.pl');
      b.disabled=true; b.textContent='جاري التحميل…';
      try{ let u=recCache[id]; if(!u){ const r=await api('adminGetRecording',S.admin.pw,id); u=recCache[id]=URL.createObjectURL(b64ToBlob(r.data,r.mime)); }
        pl.innerHTML=`<audio controls autoplay src="${u}" style="width:100%"></audio>`; b.textContent='▶ اسمع'; b.disabled=false; }
      catch(e){ toast(e); b.textContent='▶ اسمع'; b.disabled=false; } });
    $('#pane').querySelectorAll('[data-mark]').forEach(b=>b.onclick=async()=>{ const y=window.scrollY; b.disabled=true;
      try{ await adminCall('adminMarkRecording',b.dataset.mark,b.dataset.v==='1'); showAdmin('recs'); window.scrollTo(0,y); }catch(e){ toast(e); b.disabled=false; } });
  };
  draw();
}

function paneLessons(d){
  const pane=$('#pane');
  pane.innerHTML=`<div class="view">
    <div class="row" style="justify-content:space-between"><p class="muted" style="margin:0">${d.lessons.length} درس</p><button type="button" class="btn btn-red" id="newL">+ درس أو لحن جديد</button></div>
    ${SECTIONS.map(s=>{const ls=d.lessons.filter(l=>l.section===s.key); return `<div class="card view" style="gap:10px"><h3 style="color:var(--blue)">${s.title}</h3>
      ${ls.length?`<div class="alist">${ls.map(l=>`<div class="aitem"><div class="grow"><b>${esc(l.title)}</b><br><span class="hint">${s.recite?(l.videoUrl?'فيه فيديو/فويس · الطفل بيسجّل التسميع':'من غير فيديو/فويس · الطفل بيسجّل التسميع'):`${l.questions.length} أسئلة · ${l.videoUrl?'فيه فيديو للدرس':'من غير فيديو للدرس'}${(n=>n?` · ${n} ${n===1?'سؤال فيه':'أسئلة فيها'} فيديو`:'')(l.questions.filter(q=>q.videoUrl).length)}`}</span></div>
        ${l.active?'':'<span class="tag off">مخفي</span>'}<button type="button" class="mini" data-edit="${esc(l.id)}">تعديل</button><button type="button" class="mini del" data-del="${esc(l.id)}">حذف</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">مفيش لسه.</p>'}</div>`}).join('')}
  </div>`;
  $('#newL').onclick=()=>editLesson(null);
  pane.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editLesson(d.lessons.find(l=>l.id===b.dataset.edit)));
  pane.querySelectorAll('[data-del]').forEach(b=>twoStep(b,'متأكد؟ اضغط تاني',async()=>{
    try{ await adminCall('adminDeleteLesson',b.dataset.del); toast('اتحذف'); showAdmin('lessons'); }catch(e){ toast(e); } }));
}
function blankQ(){ return {question:'',raw:['','','',''],correctN:1,videoUrl:''}; }
function editLesson(l){
  const L = l ? JSON.parse(JSON.stringify({id:l.id,section:l.section,title:l.title,videoUrl:l.videoUrl,description:l.description,active:l.active,
      questions:l.questions.map(q=>({question:q.question,raw:(q.raw||q.options).concat(['','','','']).slice(0,4),correctN:q.correctN||q.correct+1,videoUrl:q.videoUrl||''}))}))
    : {id:'',section:SECTIONS[0].key,title:'',videoUrl:'',description:'',active:true,questions:[blankQ()]};
  const pane=$('#pane');
  const draw=()=>{
    killRec();
    const rec=L.section===RECITE;
    if(!rec && !L.questions.length) L.questions.push(blankQ());
    pane.innerHTML=`<form class="card view" id="lform" style="gap:16px">
      <h3 style="color:var(--blue)">${L.id?'تعديل':'جديد'}</h3>
      <div class="grid2">
        <div class="field"><label for="fSec">القسم</label><select class="inp" id="fSec">${SECTIONS.map(s=>`<option value="${esc(s.key)}" ${s.key===L.section?'selected':''}>${s.title}</option>`).join('')}</select></div>
        <div class="field"><label for="fTitle">${rec?'اسم اللحن':'اسم الدرس'}</label><input class="inp" id="fTitle" value="${esc(L.title)}" placeholder="${rec?'مثلاً: لحن الأسبوع: تين أو أوشت':'مثلاً: الحروف من ⲁ إلى ⲑ'}" required></div>
      </div>
      <div class="field"><label for="fVid">${rec?'لينك اللحن (فيديو YouTube أو فويس على Drive)':'لينك الفيديو'}</label><input class="inp" id="fVid" dir="ltr" value="${esc(L.videoUrl)}" placeholder="https://youtu.be/… أو https://drive.google.com/file/d/…">
        <span class="hint" id="vidHint"></span>
        <div class="row" style="margin-top:4px"><label class="mini" style="cursor:pointer">⬆ ارفع فويس أو فيديو من جهازك<input type="file" id="fUp" accept="audio/*,video/*" hidden></label>
          ${rec?'<button type="button" class="mini" id="fRecBtn">🎙 سجّل اللحن بصوتك</button>':''}<span class="hint" id="upSt"></span></div>
        <div id="fRec"></div></div>
      <div class="field"><label for="fDesc">${rec?'كلمتين للأطفال':'كلمتين للأطفال قبل الفيديو'}</label><textarea class="inp" id="fDesc" placeholder="${rec?'اسمع اللحن كذا مرة، وبعدين سجّل وإنت بتقوله.':'اتفرج على الفيديو كويس وركّز على…'}">${esc(L.description)}</textarea></div>
      <label class="row" style="gap:8px;font-weight:700"><input type="checkbox" id="fAct" ${L.active?'checked':''} style="width:20px;height:20px;accent-color:var(--blue)"> ظاهر للأطفال</label>
      ${rec?`<div class="demo-note" style="background:var(--blue-l);color:var(--blue)">🎙 في الألحان مفيش أسئلة. الطفل بيسمع اللحن، وبعدين بيسجّل التسميع بصوته ويدوس «خلصت التسميع»، وبياخد ${nq((S.admin.data.rules||{}).recite||0)} (تقدر تغيّرها من الإعدادات). التسجيلات بتظهرلك في تبويب «التسميع».</div>`:`
      <h3 style="color:var(--blue)">الأسئلة <span class="hint">(اختار الإجابة الصح بالدايرة اللي جنبها)</span></h3>
      <div class="view" style="gap:12px" id="qs">${L.questions.map((q,i)=>`<div class="qcard">
        <div class="qhead"><b>سؤال ${i+1}</b><button type="button" class="mini del" data-rq="${i}" ${L.questions.length<2?'disabled':''}>حذف السؤال</button></div>
        <textarea class="inp" id="q${i}" placeholder="اكتب السؤال…" style="min-height:56px">${esc(q.question)}</textarea>
        <div class="field"><label for="qv${i}" style="font-weight:500;font-size:.85rem">🎬 فيديو للسؤال ده (اختياري)</label><input class="inp" id="qv${i}" dir="ltr" value="${esc(q.videoUrl||'')}" placeholder="https://youtu.be/… (سيبه فاضي لو مفيش)"></div>
        ${q.raw.map((o,j)=>`<div class="optrow"><input type="radio" name="c${i}" id="c${i}_${j}" value="${j+1}" ${q.correctN===j+1?'checked':''} aria-label="الإجابة الصح"><input class="inp" id="o${i}_${j}" value="${esc(o)}" placeholder="اختيار ${AR[j]}${j>1?' (اختياري)':''}"></div>`).join('')}
      </div>`).join('')}</div>
      <button type="button" class="btn btn-soft" id="addQ" style="align-self:flex-start">+ سؤال كمان</button>`}
      <div id="ferr" style="color:var(--red);font-weight:700"></div>
      <div class="row"><button type="submit" class="btn btn-blue" id="saveL">حفظ</button><button type="button" class="btn btn-line" id="cancelL">إلغاء</button></div>
    </form>`;
    const vh=()=>{const v=videoEmbed($('#fVid').value); $('#vidHint').textContent=!v?'حط لينك YouTube (ممكن يبقى Unlisted) أو لينك من Google Drive، أو ارفع ملف من جهازك.':v.kind==='yt'?'✓ YouTube':v.kind==='drive'?'✓ ملف Google Drive':v.kind==='file'?'✓ ملف':'اللينك ده مش YouTube ولا Drive، هيظهر كلينك بس.';};
    $('#fVid').oninput=vh; vh();
    $('#fSec').onchange=()=>{ sync(); draw(); };
    const upload=async(blob,name)=>{
      if(blob.size>MAX_UPLOAD) throw 'الملف أكبر من 18 ميجا. صغّره أو ارفعه على YouTube';
      $('#upSt').textContent='جاري الرفع… استنى';
      const data=await blobToB64(blob);
      const r=await api('adminUploadMedia',S.admin.pw,{name,mime:blob.type||'audio/webm',data});
      $('#fVid').value=r.url; vh(); $('#upSt').textContent='✓ اترفع. متنساش تدوس «حفظ»';
    };
    $('#fUp').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
      try{ await upload(f, f.name); }catch(err){ $('#upSt').textContent=String(err); } e.target.value=''; };
    const rb=$('#fRecBtn'); if(rb) rb.onclick=()=>{ rb.hidden=true;
      mountRecorder($('#fRec'),{startLabel:'ابدأ تسجيل اللحن', doneLabel:'✓ استخدم التسجيل ده', onSubmit:async(blob)=>{
        await upload(blob,'لحن - '+($('#fTitle').value||'تسجيل')+'.'+(/mp4/.test(blob.type)?'m4a':'webm')); $('#fRec').innerHTML=''; rb.hidden=false; }}); };
    const aq=$('#addQ'); if(aq) aq.onclick=()=>{ sync(); L.questions.push(blankQ()); draw(); pane.querySelector('.qcard:last-child textarea').focus(); };
    pane.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{ sync(); L.questions.splice(Number(b.dataset.rq),1); draw(); });
    $('#cancelL').onclick=()=>showAdmin('lessons');
    $('#lform').onsubmit=async e=>{ e.preventDefault(); sync();
      const err=validate(); if(err){ $('#ferr').textContent=err; return; }
      $('#saveL').disabled=true; $('#saveL').textContent='جاري الحفظ…';
      const payload={...L, questions:L.section===RECITE?[]:L.questions};
      try{ await adminCall('adminSaveLesson',payload); toast('اتحفظ'); showAdmin('lessons'); }
      catch(e2){ $('#ferr').textContent=e2; $('#saveL').disabled=false; $('#saveL').textContent='حفظ'; } };
  };
  const sync=()=>{
    L.section=$('#fSec').value; L.title=$('#fTitle').value.trim(); L.videoUrl=$('#fVid').value.trim(); L.description=$('#fDesc').value.trim(); L.active=$('#fAct').checked;
    if(!$('#q0')) return;
    L.questions.forEach((q,i)=>{ q.question=$('#q'+i).value.trim(); q.videoUrl=$('#qv'+i).value.trim(); q.raw=q.raw.map((_,j)=>$('#o'+i+'_'+j).value.trim());
      const c=pane.querySelector(`input[name="c${i}"]:checked`); q.correctN=c?Number(c.value):1; });
  };
  const validate=()=>{
    if(!L.title) return 'اكتب الاسم.';
    if(L.section===RECITE) return '';
    for(let i=0;i<L.questions.length;i++){ const q=L.questions[i];
      if(!q.question) return `سؤال ${i+1}: اكتب نص السؤال.`;
      if(q.raw.filter(Boolean).length<2) return `سؤال ${i+1}: محتاج اختيارين على الأقل.`;
      if(!q.raw[q.correctN-1]) return `سؤال ${i+1}: الإجابة الصح اللي اخترتها فاضية.`; }
    return '';
  };
  draw(); goTop();
}
